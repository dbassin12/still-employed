    { id: 'nameit', d: 'prices', lvl: 1, n: 8, ask: 'Prices still rising, or falling?', bins: ['Still rising', 'Falling'], pool: () => NAMEIT.filter((x) => x.key === 'dis' || x.key === 'de').map((x) => ({ t: x.t, bin: x.key === 'dis' ? 0 : 1, y: x.y })) },
  ];
  PILES.forEach((sp) => {
    const recs = Array.from({ length: sp.n }, (_, i) => ({ k: String(i + 1), lvl: sp.lvl }));
    kind('pile-' + sp.id, sp.d, 'pile', recs, (x, r) => {
      const pool = shuffle(r, sp.pool());
      const a = pool.filter((c) => c.bin === 0), b = pool.filter((c) => c.bin === 1);
      const nA = 1 + Math.floor(r() * 3);
      const cards = shuffle(r, a.slice(0, nA).concat(b.slice(0, 4 - nA)));
      return fin({ desk: sp.d, verb: 'pile', lvl: sp.lvl, order: 'SORT THE PILE', ask: sp.ask, cards, options: sp.bins.map((label, i) => ({ label, stampClass: 'neutral', key: i })), why: 'Every card went in the right pile.' }, cards.map((c) => c.t));
    });
  });

  /* ================= which one is different ================= */
  /* Every one of these says what the four things are being sorted by and names the possible groups,
     so a student is never guessing the rule. The reveal names each group in full. */
  const short = (s) => s.length <= 46;
  const PART = { C: 'consumption (C)', I: 'investment (I)', G: 'government purchases (G)', Xn: 'net exports (Xn)' };
  const LEFT_OUT = { used: 'a used good', intermediate: 'an intermediate good', financial: 'a stock or bond', transfer: 'a transfer', abroad: 'made abroad' };
  const LEFT_OUT3 = { used: 'used goods', intermediate: 'intermediate goods', financial: 'stocks and bonds', transfer: 'transfers', abroad: 'made abroad' };
  const binNote = (k) => `${B.BIN[k].label}: ${B.BIN[k].def}`;
  const SAME = 'Three are the same. Tap the one that is different.';
  const gdpNot = (a, b) => {
    const aIn = !!PART[a], bIn = !!PART[b];
    if (!aIn && !bIn) return { ask: 'None of these count in U.S. GDP. Three are left out for the same reason. Tap the one left out for a different reason.', why: `That one is ${LEFT_OUT[b]}. The other three are ${LEFT_OUT3[a]}.` };
    const ask = `Each one either counts in U.S. GDP or does not. ${SAME}`;
    if (aIn) return { ask, why: `That one does not count: it is ${LEFT_OUT[b]}. The other three count as ${PART[a]}.` };
    return { ask, why: `That one counts as ${PART[b]}. The other three do not count: they are ${LEFT_OUT3[a]}.` };
  };
  const lower = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  const ODD = [
    ...[['C', 'I'], ['I', 'C'], ['G', 'C'], ['C', 'G'], ['I', 'G'], ['G', 'I'], ['Xn', 'C'], ['C', 'Xn'], ['Xn', 'I'], ['I', 'Xn'], ['G', 'Xn'], ['Xn', 'G']].map(([a, b]) => ({ d: 'gdp', lvl: 2, ask: 'Each one counts in GDP as C, I, G, or Xn. Three are the same part. Tap the one that is a different part.', why: `That one is ${PART[b]}. The other three are ${PART[a]}.`, label: (g) => g.s, group: (k) => GDP.filter((g) => g.line === k && g.lvl <= 2), tag: (k) => B.BIN[k].label, note: binNote, a, b })),
    ...[['transfer', 'G'], ['G', 'transfer'], ['used', 'C'], ['C', 'used'], ['financial', 'I'], ['I', 'financial'], ['intermediate', 'C'], ['abroad', 'C'], ['C', 'abroad'], ['used', 'financial'], ['transfer', 'used']].map(([a, b]) => Object.assign({ d: 'gdp', lvl: 2, label: (g) => g.s, group: (k) => GDP.filter((g) => (g.line === k || g.no === k) && g.lvl <= 2 && !((a === 'G' || b === 'G') && /gift/i.test(g.s))), tag: (k) => B.BIN[k].label, note: (k) => (PART[k] ? `Counts as ${B.BIN[k].label}` : `Not counted: ${lower(B.BIN[k].label)}`), a, b }, gdpNot(a, b))),
    ...[['E', 'U'], ['U', 'E'], ['N', 'E'], ['E', 'N'], ['U', 'N'], ['N', 'U'], ['E', 'U'], ['U', 'N'], ['N', 'E']].map(([a, b], i) => ({ d: 'jobs', lvl: 1, ask: `The Bureau counts each person as employed, unemployed, or not in the labor force. Three get the same label. Tap the one who gets a different label.`, why: `That one is ${lower(B.BIN[b].label)}. The other three are ${lower(B.BIN[a].label)}.`, label: (p) => p.s, group: (k) => PEOPLE.filter((p) => p.st === k), tag: (k) => B.BIN[k].label, a, b, tagKey: i })),
    ...[['gains', 'loses'], ['loses', 'gains'], ['protected', 'loses'], ['loses', 'protected'], ['gains', 'protected'], ['protected', 'gains']].map(([a, b]) => ({ d: 'costs', lvl: 1, ask: 'Surprise inflation hits. Each one gains, loses, or is protected. Three get the same result. Tap the one that gets a different result.', why: `That one ${{ gains: 'gains', loses: 'loses', protected: 'is protected' }[b]}. The other three ${{ gains: 'gain', loses: 'lose', protected: 'are protected' }[a]}.`, label: (e) => e.s, group: (k) => EFFECTS.filter((e) => e.key === k), tag: (k) => B.BIN[k].label, a, b })),
    ...[['out', 'in'], ['in', 'out'], ['out', 'in'], ['in', 'out'], ['out', 'in'], ['in', 'out']].map(([a, b]) => ({ d: 'gdp', lvl: 1, ask: `Each one either takes money out of the circular flow or puts money into it. ${SAME}`, why: `That one ${b === 'out' ? 'takes money out of the loop' : 'puts money into the loop'}. The other three ${a === 'out' ? 'take money out' : 'put money in'}.`, label: (l) => l.s, group: (k) => LOOP.filter((l) => l.dir === k), tag: (k) => (k === 'out' ? 'Leaves the loop' : 'Comes into the loop'), a, b })),
    ...[['Real', 'Nominal'], ['Nominal', 'Real'], ['Real', 'Nominal'], ['Nominal', 'Real']].map(([a, b]) => ({ d: 'real', lvl: 1, ask: 'Each line describes real GDP or nominal GDP. Three describe the same one. Tap the line that describes the other one.', why: `That line describes ${lower(b)} GDP. The other three describe ${lower(a)} GDP.`, label: (x) => x.t, group: (k) => REALNOM.filter((x) => x.key === k && short(x.t) && !/\b(pay|rate|raise)\b/i.test(x.t)), tag: (k) => `${k} GDP`, a, b })),
    ...[['dis', 'de'], ['de', 'dis'], ['rising', 'de'], ['dis', 'rising'], ['rising', 'dis'], ['de', 'rising']].map(([a, b]) => ({ d: 'prices', lvl: 2, ask: `Each line is rising inflation, disinflation, or deflation. ${SAME}`, why: `That one is ${lower(B.BIN[b].label)}. The other three are ${lower(B.BIN[a].label)}.`, label: (x) => x.t, group: (k) => NAMEIT.filter((x) => x.key === k && short(x.t)), tag: (k) => B.BIN[k].label, note: binNote, a, b })),
    ...[['expansion', 'contraction'], ['contraction', 'expansion'], ['expansion', 'contraction'], ['contraction', 'expansion']].map(([a, b]) => ({ d: 'cycle', lvl: 1, ask: 'Each line describes an expansion or a contraction. Three describe the same phase. Tap the line that describes the other phase.', why: `That line describes ${b === 'expansion' ? 'an expansion' : 'a contraction'}. The other three describe ${a === 'expansion' ? 'an expansion' : 'a contraction'}.`, label: (x) => x.t, group: (k) => PHASES.filter((x) => x.key === k && short(x.t)), tag: (k) => B.BIN[k].label, note: binNote, a, b })),
    ...[['menu', 'shoe'], ['shoe', 'menu']].map(([a, b]) => ({ d: 'costs', lvl: 2, ask: `Each one is a menu cost or a shoe-leather cost of inflation. ${SAME}`, why: `That one is a ${b === 'menu' ? 'menu' : 'shoe-leather'} cost. The other three are ${a === 'menu' ? 'menu' : 'shoe-leather'} costs.`, label: (x) => x.t, group: (k) => COSTS.filter((x) => x.key === k && short(x.t)), tag: (k) => B.BIN[k].label, note: binNote, a, b })),
    ...[['Elastic', 'Inelastic'], ['Inelastic', 'Elastic']].map(([a, b]) => ({ d: 'micro', lvl: 1, ask: `The price goes up. For each one, demand is elastic (buyers switch away) or inelastic (buyers keep buying). ${SAME}`, why: `Demand for that one is ${lower(b)}. Demand for the other three is ${lower(a)}.`, label: (x) => x.t, group: (k) => MICRO_ELASTIC.filter((x) => x.key === k && !/%/.test(x.t)), tag: (k) => k, note: (k) => (k === 'Elastic' ? 'Elastic: buyers can switch away' : 'Inelastic: buyers keep buying'), a, b })),
  ];
  const oddRecs = ODD.filter((o) => o.group(o.a).length >= 3 && o.group(o.b).length >= 1).map((o, i) => Object.assign({ k: `o${i}` }, o));
  eachDesk(oddRecs, 'odd', 'oddone', (x, r) => {
    const three = shuffle(r, x.group(x.a)).slice(0, 3);
    const odd = pickOne(r, x.group(x.b));
    const all = shuffle(r, three.concat([odd]));
    const options = all.map((rec) => { const k = rec === odd ? x.b : x.a; return { label: x.label(rec), tag: x.tag(k), note: x.note ? x.note(k) : x.tag(k) }; });
    return fin({ desk: x.d, verb: 'oddone', lvl: x.lvl, order: 'WHICH ONE IS DIFFERENT?', ask: x.ask, options, answer: all.indexOf(odd), why: x.why }, options.map((o) => o.label));
  });

  /* ================= tap the wave: anywhere on the curve, no markers ================= */
  function zonesFor(prop, phi) {
    const h = 0.0005;
    const slope = (x) => (wave.actual(x + h, phi) - wave.actual(x - h, phi)) / (2 * h);
    const gap = (x) => wave.actual(x, phi) - wave.potential(x);
    if (prop === 'peak' || prop === 'trough') {
      const out = [];
      for (let x = 0.02; x < 0.98; x += 0.0015) {
        const a = slope(x), b = slope(x + 0.0015);
        if (prop === 'peak' && a > 0 && b <= 0) out.push([Math.max(0, x - 0.045), Math.min(1, x + 0.045)]);
        if (prop === 'trough' && a < 0 && b >= 0) out.push([Math.max(0, x - 0.045), Math.min(1, x + 0.045)]);
      }
      return out;
    }
    const test = { contraction: (x) => slope(x) < 0, expansion: (x) => slope(x) > 0, above: (x) => gap(x) > 0.012, below: (x) => gap(x) < -0.012 }[prop];
    const out = [];
    let start = null;
    for (let x = 0; x <= 1.0001; x += 0.002) {
      if (x <= 1 && test(x)) { if (start === null) start = x; } else if (start !== null) { if (x - start > 0.05) out.push([start, Math.min(1, x)]); start = null; }
    }
    return out;
  }
  const WAVES = [
    { prop: 'peak', order: 'TAP THE WAVE AT A PEAK', ask: 'Tap the top of the wave.', lvl: 1, y: 'The peak is the top of the wave. Real GDP falls next.' },
    { prop: 'trough', order: 'TAP THE WAVE AT A TROUGH', ask: 'Tap the bottom of the wave.', lvl: 1, y: 'The trough is the bottom of the wave. Real GDP rises next.' },
    { prop: 'contraction', order: 'TAP WHERE THE WAVE FALLS', ask: 'Contraction: tap anywhere real GDP is falling.', lvl: 1, y: 'Falling real GDP is a contraction.' },
    { prop: 'expansion', order: 'TAP WHERE THE WAVE RISES', ask: 'Expansion: tap anywhere real GDP is rising.', lvl: 1, y: 'Rising real GDP is an expansion.' },
    { prop: 'above', order: 'TAP THE WAVE ABOVE POTENTIAL', ask: 'Positive gap: tap where actual is above potential.', lvl: 2, y: 'Above the line is a positive gap. Unemployment is below the natural rate.' },
    { prop: 'below', order: 'TAP THE WAVE BELOW POTENTIAL', ask: 'Negative gap: tap where actual is below potential.', lvl: 2, y: 'Below the line is a negative gap. Unemployment is above the natural rate.' },
  ];
  const waveRecs = [];
  WAVES.forEach((w) => PHIS.forEach((phi, j) => { if (zonesFor(w.prop, phi).length) waveRecs.push(Object.assign({ k: `${w.prop}${j}`, phi }, w)); }));
  kind('wave', 'cycle', 'wave', waveRecs, (x) => finish({ desk: 'cycle', verb: 'wave', lvl: x.lvl, order: x.order, ask: x.ask, prop: x.prop, zones: zonesFor(x.prop, x.phi), chart: { kind: 'cycle', phi: x.phi, markers: [] }, why: x.y }));

  /* ================= label it: one spot lights up at a time ================= */
  const labelRecs = [];
  PHIS.forEach((phi, j) => { for (let i = 0; i < 3; i++) labelRecs.push({ k: `c${j}${i}`, phi, d: 'cycle', lvl: 1 }); });
  kind('label-cycle', 'cycle', 'label', labelRecs, (x, r) => {
    const pts = wave.points(x.phi);
    const of = (ph) => pts.filter((p) => p.phase === ph);
    let chosen = null;
    for (let tries = 0; tries < 60 && !chosen; tries++) {
      const trial = ['peak', 'trough', 'expansion', 'contraction'].map((ph) => pickOne(r, of(ph))).sort((a, b) => a.x - b.x);
      if (trial.every((p, i) => i === 0 || p.x - trial[i - 1].x >= 0.14)) chosen = trial;
    }
    if (!chosen) return null;
    const options = bins('expansion', 'peak', 'contraction', 'trough');
    const steps = shuffle(r, chosen.map((m, i) => ({ spot: i, answer: options.findIndex((o) => o.key === m.phase) })));
    return finish({ desk: 'cycle', verb: 'label', lvl: 1, diagram: 'cycle', order: 'LABEL THE GRAPH', ask: 'Name each lit point.', chart: { kind: 'cycle', phi: x.phi, markers: chosen, pickOne: false, labeling: true }, options, steps, why: 'Rising is expansion, falling is contraction, and the turning points are peak and trough.' });
  });
  const FLOW_SPOTS = ['Goods and services', 'Consumption expenditures', 'Factors of production', 'Wages, rent, interest, profit', 'Product market', 'Factor market'];
  kind('label-flow', 'gdp', 'label', Array.from({ length: 14 }, (_, i) => ({ k: `f${i}`, lvl: 2 })), (x, r) => {
    const spots = shuffle(r, FLOW_SPOTS.map((_, i) => i)).slice(0, 4);
    const options = FLOW_SPOTS.map((label) => ({ label }));
    return finish({ desk: 'gdp', verb: 'label', lvl: 2, diagram: 'flow', order: 'LABEL THE LOOP', ask: 'Name each lit part of the circular flow.', options, steps: spots.map((s) => ({ spot: s, answer: s })), why: 'Inner loop: real things. Outer loop: money. Top: product market. Bottom: factor market.' });
  });

  /* ================= more graphs (Nov 17, 2026) =================
     Three new pictures, all under the chart verb, so the clock, the pay, and the keys are the ones students know.
     - ppc: the production possibilities curve from Unit 1, read as Unit 2 reads it. On the curve is potential real GDP,
       inside it is a recession, and only growth moves the curve. After the answer the curve shifts or the dot moves.
     - sd: supply and demand from Unit 1. A price ceiling or floor to read, and a curve that shifts after the answer.
     - line: the inflation rate as a line. A falling line is not falling prices.
     Every key below is computed from the numbers in the record, and bank.test.js computes it again its own way. */
  const graphTask = (t, more) => { fin(t, t.options.map((o) => o.label)); t.clock = Math.round((t.clock + (more || 5)) * 10) / 10; return t; };
  const PPC_LAYOUTS = [
    { k: 'a', on: 52, inside: [0.44, 0.42], outside: [0.90, 0.74] },
    { k: 'b', on: 28, inside: [0.32, 0.56], outside: [0.74, 0.88] },
    { k: 'c', on: 66, inside: [0.58, 0.30], outside: [0.92, 0.66] },
  ];
  const PPC_ASKS = [
    { k: 'rec', prop: 'inside', lvl: 1, order: 'TAP THE RECESSION', ask: 'The curve is what the economy can make at full employment. Tap the point that shows a recession.', y: 'Inside the curve, workers and plants sit idle. Actual real GDP is below potential.' },
    { k: 'cyc', prop: 'inside', lvl: 2, order: 'TAP CYCLICAL UNEMPLOYMENT', ask: 'The curve is what the economy can make at full employment. Tap the point with cyclical unemployment.', y: 'Cyclical unemployment means idle workers, so output is inside the curve.' },
    { k: 'full', prop: 'on', lvl: 2, order: 'TAP FULL EMPLOYMENT', ask: 'Tap the point where actual real GDP equals potential real GDP.', y: 'On the curve, the economy is at full employment. Unemployment equals the natural rate.' },
    { k: 'out', prop: 'outside', lvl: 2, order: 'TAP THE POINT OUT OF REACH', ask: 'Tap the point the economy cannot reach until the curve shifts out.', y: 'Outside the curve takes more resources or better technology.' },
    { k: 'gap', prop: 'inside', lvl: 3, order: 'TAP THE NEGATIVE GAP', ask: 'The curve is potential real GDP. Tap the point with a negative output gap.', y: 'A negative gap means actual real GDP is below potential. That is inside the curve.' },
    { k: 'nat', prop: 'on', lvl: 3, order: 'TAP THE NATURAL RATE', ask: 'Tap the point where unemployment equals the natural rate.', y: 'At the natural rate there is no cyclical unemployment, so the economy is on the curve.' },
  ];
  const rad = (deg) => deg * Math.PI / 180;
  const ppcPoints = (L) => [
    { where: 'inside', x: L.inside[0], y: L.inside[1] },
    { where: 'on', x: Math.cos(rad(L.on)), y: Math.sin(rad(L.on)) },
    { where: 'outside', x: L.outside[0], y: L.outside[1] },
  ];
  const ppcTapRecs = [];
  PPC_ASKS.forEach((a) => PPC_LAYOUTS.forEach((L) => ppcTapRecs.push({ k: a.k + '-' + L.k, lvl: a.lvl, a, L })));
  kind('ppc-tap', 'cycle', 'chart', ppcTapRecs, (x, r) => {
    const pts = shuffle(r, ppcPoints(x.L));
    return finish({
      desk: 'cycle', verb: 'chart', lvl: x.a.lvl, order: x.a.order, ask: x.a.ask,
      chart: { kind: 'ppc', points: pts, pickOne: true, prop: x.a.prop },
      options: pts.map((p, i) => ({ label: 'Point ' + (i + 1) })), answer: pts.findIndex((p) => p.where === x.a.prop), why: x.a.y,
    });
  });

  /* curve: 'out', 'in', or null. dot: where the economy starts and, when the curve stays put, where it ends up. */
  const PPC_MOVES = [
    { k: 'layoffs', lvl: 2, t: 'A recession hits. Firms lay off workers and idle their plants.', curve: null, from: 'on', to: 'inside', y: 'The workers and plants still exist, so the curve stays. The economy moves to a point inside it.' },
    { k: 'rehire', lvl: 2, t: 'The recession ends. Laid-off workers are hired back.', curve: null, from: 'inside', to: 'on', y: 'Idle workers go back to work. The economy moves back to the same curve.' },
    { k: 'cyclical', lvl: 3, t: 'Cyclical unemployment rises from 0% to 3%.', curve: null, from: 'on', to: 'inside', y: 'More idle workers means less output from the same resources. A move inside the curve, not a shift.' },
    { k: 'natural', lvl: 3, t: 'Unemployment falls from 8% back to the natural rate of 5%.', curve: null, from: 'inside', to: 'on', y: 'The economy returns to full employment. It moves back to the curve it already had.' },
    { k: 'tech', lvl: 1, t: 'New technology lets every worker make more.', curve: 'out', from: 'on', y: 'More output from the same resources. Potential real GDP rises.' },
    { k: 'capital', lvl: 2, t: 'Firms build many new factories and machines.', curve: 'out', from: 'on', y: 'More capital means the economy can make more. Potential real GDP rises.' },
    { k: 'school', lvl: 2, t: 'Workers get more education and training.', curve: 'out', from: 'on', y: 'More skilled workers can make more. Potential real GDP rises.' },
    { k: 'laborforce', lvl: 2, t: 'The labor force grows by two million workers.', curve: 'out', from: 'on', y: 'More workers means more can be made. Potential real GDP rises.' },
    { k: 'storm', lvl: 1, t: 'A hurricane destroys factories, roads, and ports.', curve: 'in', from: 'on', y: 'With less capital, the economy can make less. Potential real GDP falls.' },
    { k: 'shrink', lvl: 3, t: 'The working-age population shrinks for a decade.', curve: 'in', from: 'on', y: 'Fewer workers means less can be made. Potential real GDP falls.' },
  ];
  const PPC_OPTS = ['Shifts out', 'Shifts in', 'No shift'];
  kind('ppc-move', 'cycle', 'chart', PPC_MOVES, (x) => graphTask({
    desk: 'cycle', verb: 'chart', lvl: x.lvl, order: 'DOES THE PPC SHIFT?', text: x.t,
    chart: { kind: 'ppc', dot: x.from, to: x.to || null, curve: x.curve },
    options: PPC_OPTS.map((label) => ({ label })), answer: x.curve === 'out' ? 0 : x.curve === 'in' ? 1 : 2, why: x.y,
  }));

  /* Supply and demand. Demand is P = 10 - Q and supply is P = Q, so equilibrium is at 5 and 5. */
  const SD_EQ = 5;
  const SD_CONTROLS = [
    { k: 'rent', lvl: 1, type: 'ceiling', p: 3, t: 'Apartments. The town sets the price ceiling on the graph.' },
    { k: 'tickets', lvl: 2, type: 'ceiling', p: 7, t: 'Concert tickets. The law sets the price ceiling on the graph.' },
    { k: 'gas', lvl: 1, type: 'ceiling', p: 3.5, t: 'Gasoline. The state sets the price ceiling on the graph.' },
    { k: 'wheat', lvl: 1, type: 'floor', p: 7, t: 'Wheat. The government sets the price floor on the graph.' },
    { k: 'milk', lvl: 2, type: 'floor', p: 3, t: 'Milk. The government sets the price floor on the graph.' },
    { k: 'sugar', lvl: 1, type: 'floor', p: 6.5, t: 'Sugar. The government sets the price floor on the graph.' },
    { k: 'minwage', lvl: 2, type: 'floor', p: 7, labor: true, t: 'Summer jobs. The minimum wage is the price floor on the graph.' },
    { k: 'minwage2', lvl: 2, type: 'floor', p: 3.5, labor: true, t: 'Tutors. The minimum wage is the price floor on the graph.' },
  ];
  const sdControlKey = (c) => (c.type === 'ceiling' ? (c.p < SD_EQ ? 'Shortage' : 'No effect') : (c.p > SD_EQ ? 'Surplus' : 'No effect'));
  const sdControlWhy = (c) => {
    const key = sdControlKey(c);
    if (key === 'Shortage') return 'The ceiling is below equilibrium, so it binds. Buyers want more than sellers offer. A shortage.';
    if (key === 'Surplus') return c.labor ? 'The floor is above the equilibrium wage, so it binds. More people want jobs than firms will hire. A surplus of labor.' : 'The floor is above equilibrium, so it binds. Sellers offer more than buyers want. A surplus.';
    return c.type === 'ceiling' ? 'The ceiling is above equilibrium, so it does not bind. The market stays at equilibrium.' : 'The floor is below equilibrium, so it does not bind. The market stays at equilibrium.';
  };
  kind('sd-control', 'micro', 'chart', SD_CONTROLS, (x) => {
    const options = plain('Shortage', 'Surplus', 'No effect');
    return graphTask({
      desk: 'micro', verb: 'chart', lvl: x.lvl, order: 'FLASHBACK: READ THE GRAPH', text: x.t,
      chart: { kind: 'sd', control: { type: x.type, p: x.p }, labor: !!x.labor },
      options, answer: options.findIndex((o) => o.label === sdControlKey(x)), why: sdControlWhy(x),
    });
  });

  /* c: which curve. d: +1 shifts right, -1 shifts left. The cause words match the Unit 1 list of shifters. */
  const SD_SHIFTS = [
    { k: 'meals', lvl: 1, c: 'D', d: 1, t: 'The market for restaurant meals, a normal good. Incomes rise in an expansion.', y: 'Higher income raises demand for a normal good.' },
    { k: 'cars', lvl: 1, c: 'D', d: -1, t: 'The market for new cars, a normal good. A recession cuts incomes.', y: 'Lower income cuts demand for a normal good.' },
    { k: 'tea', lvl: 2, c: 'D', d: 1, t: 'The market for tea. The price of coffee, a substitute, rises.', y: 'Buyers switch from coffee to tea.' },
    { k: 'buns', lvl: 2, c: 'D', d: -1, t: 'The market for hot dog buns. The price of hot dogs, a complement, rises.', y: 'Fewer hot dogs sold means fewer buns wanted.' },

      g.gain.setValueAtTime(peak, off);
      g.gain.setTargetAtTime(0, off, 0.13);
      src.start(t);

      if (track) voices.add(voice);
      src.onended = () => {
        voices.delete(voice);
        try { wobble.disconnect(wob); wob.disconnect(); src.disconnect(); tone.disconnect(); g.disconnect(); } catch (e) { /* already gone */ }

    function bassNote(midi, t, dur, vel) {
      const sample = Dsp.nearest(Dsp.BASS_NOTES, midi), buffer = bank.bass.get(sample);
      if (!buffer) return;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.playbackRate.value = Math.pow(2, (midi - sample) / 12);
      const peak = LEVEL.bass * vel;
      const g = gainOf(peak, stems.bass);

      g.gain.setTargetAtTime(0, off, 0.07);

    function scheduleBar(bar, t0) {

<script>

  /* ================= clock: the fuse across the top ================= */
  const Clock = {
    total: 0, left: 0, on: false, last: 0, cb: null, raf: 0, lastTick: 99,
    start(sec, cb) {
      this.total = sec; this.left = sec; this.on = true; this.cb = cb; this.last = performance.now(); this.lastTick = 99;
      const f = $('#fuse'); f.hidden = false;
      cancelAnimationFrame(this.raf);
      this.raf = requestAnimationFrame(this.frame.bind(this));
      this.paint();
    },
    frame(now) {
      if (!this.on) return;
      const dt = (now - this.last) / 1000; this.last = now;
      if (!document.hidden) this.left -= Math.min(dt, 0.25);
      this.paint();
      if (this.left <= 3 && Math.ceil(this.left) < this.lastTick) { this.lastTick = Math.ceil(this.left); Sound.play('clock'); }
      if (this.left <= 0) { this.on = false; const cb = this.cb; this.cb = null; if (cb) cb(); return; }
      this.raf = requestAnimationFrame(this.frame.bind(this));
    },
    paint() {
      const i = $('#fuse i'); if (!i) return;
      const p = Math.max(0, this.left / this.total);
      i.style.transform = `scaleX(${p})`;
      const sec = $('#fuse b'), n = Math.max(0, Math.ceil(this.left));
      if (sec && sec.textContent !== String(n)) sec.textContent = n;
      const f = $('#fuse');
      f.classList.toggle('low', p <= 0.35 && p > 0.15);
      f.classList.toggle('crit', p <= 0.15);
    },
    stop() { const p = this.on && this.total ? Math.max(0, this.left / this.total) : 0; this.on = false; this.cb = null; cancelAnimationFrame(this.raf); return p; },
    hide() { this.on = false; this.cb = null; cancelAnimationFrame(this.raf); const f = $('#fuse'); if (f) f.hidden = true; },
  };

  /* ---------- business cycle chart ---------- */
  let CW = 640, CH = 300;
  const CL = 40, CR = 14, CT = 12, CB = 34;
  const chartSize = () => { const phone = window.innerWidth < 620; CW = phone ? 460 : 640; CH = phone ? 300 : 300; };
  const cx = (x) => CL + x * (CW - CL - CR);
  const cy = (v) => CH - CB - ((v - 0.08) / 0.78) * (CH - CB - CT);
  function cycleSVG(t, tapWave) {
    chartSize();
    const c = t.chart, phi = c.phi, W = B.wave;
    let actual = '', fillsPos = '', fillsNeg = '';
    const N = 120;
    for (let i = 0; i <= N; i++) {
      const x = i / N;
      actual += `${i ? 'L' : 'M'}${cx(x).toFixed(1)} ${cy(W.actual(x, phi)).toFixed(1)} `;
      if (i < N) {
        const x2 = (i + 1) / N;
        const a1 = W.actual(x, phi), a2 = W.actual(x2, phi), p1 = W.potential(x), p2 = W.potential(x2);
        const seg = `<polygon points="${cx(x).toFixed(1)},${cy(a1).toFixed(1)} ${cx(x2).toFixed(1)},${cy(a2).toFixed(1)} ${cx(x2).toFixed(1)},${cy(p2).toFixed(1)} ${cx(x).toFixed(1)},${cy(p1).toFixed(1)}"/>`;
        if ((a1 + a2) / 2 >= (p1 + p2) / 2) fillsPos += seg; else fillsNeg += seg;
      }
    }
    const marks = c.markers.map((m, i) => {
      const X = cx(m.x), Y = cy(W.actual(m.x, phi));
      const act = c.pickOne ? `data-act="pick" data-i="${i}" role="button" aria-label="Point ${i + 1}"` : '';
      const num = c.pickOne || c.labeling ? i + 1 : '';
      return `<g class="mk ${c.pickOne ? 'tap' : c.labeling ? 'spot' : 'focus'}" data-mk="${i}" ${act}><circle class="mk-hit" cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="32"/><circle class="mk-dot" cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="17"/><text class="mk-num" x="${X.toFixed(1)}" y="${(Y + 6).toFixed(1)}" text-anchor="middle">${num}</text></g>`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="A business cycle graph: actual real GDP moves in a wave around a rising line of potential real GDP.">
      <g class="gapfill pos">${fillsPos}</g><g class="gapfill neg">${fillsNeg}</g>
      <line class="axis" x1="${CL}" y1="${CT}" x2="${CL}" y2="${CH - CB}"/><line class="axis" x1="${CL}" y1="${CH - CB}" x2="${CW - CR}" y2="${CH - CB}"/>
      <text class="ax" transform="translate(16 ${(CH - CB) / 2 + 6}) rotate(-90)" text-anchor="middle">Real GDP</text>
      <text class="ax" x="${(CW + CL) / 2}" y="${CH - 10}" text-anchor="middle">Time</text>
      <line class="pot" x1="${cx(0)}" y1="${cy(W.potential(0))}" x2="${cx(1)}" y2="${cy(W.potential(1))}"/>
      <path class="act" d="${actual}"/>
      <g class="legend"><line class="act-key" x1="${CL + 10}" y1="${CT + 8}" x2="${CL + 34}" y2="${CT + 8}"/><text class="lab" x="${CL + 40}" y="${CT + 14}">Actual Real GDP</text><line class="pot-key" x1="${CL + 176}" y1="${CT + 8}" x2="${CL + 204}" y2="${CT + 8}"/><text class="lab" x="${CL + 210}" y="${CT + 14}">Potential Real GDP</text></g>
      ${marks}
      ${tapWave ? `<rect class="wave-hit" data-act="wavetap" x="${CL}" y="${CT}" width="${CW - CL - CR}" height="${CH - CB - CT}" role="button" aria-label="Tap the wave"/>` : ''}
    </svg>`;
  }

  /* ---------- bars: a value label on every bar, and a dashed line for the natural rate ---------- */
  function barsSVG(t) {
    chartSize();
    const vals = t.bars.map((b) => b.v);
    const hi = Math.max(...vals, t.line || 0, 0), lo = Math.min(...vals, 0);
    const top = CT + 24, bottom = CH - CB - (lo < 0 ? 26 : 0);
    const y = (v) => bottom - (v - lo) / ((hi - lo) || 1) * (bottom - top);
    const n = t.bars.length, slot = (CW - CL - CR) / n, w = slot * 0.56;
    const zero = y(0);
    const num = (v) => `${v < 0 ? B.MINUS : ''}${Math.abs(v)}${t.suf || ''}`;
    const bars = t.bars.map((b, i) => {
      const x = CL + slot * i + (slot - w) / 2, yy = y(b.v), up = b.v >= 0;
      return `<g class="barwrap" data-mk="${i}" data-act="pick" data-i="${i}" role="button" aria-label="${esc(b.label)}"><rect class="barhit" x="${(CL + slot * i).toFixed(1)}" y="${CT}" width="${slot.toFixed(1)}" height="${CH - CB - CT}"/><rect class="bar" x="${x.toFixed(1)}" y="${Math.min(yy, zero).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(2, Math.abs(zero - yy)).toFixed(1)}"/><text class="bar-val" x="${(x + w / 2).toFixed(1)}" y="${(up ? yy - 7 : yy + 20).toFixed(1)}" text-anchor="middle">${esc(num(b.v))}</text></g>`;
    }).join('');
    const line = t.line != null ? `<line class="natline" x1="${CL}" x2="${CW - CR}" y1="${y(t.line).toFixed(1)}" y2="${y(t.line).toFixed(1)}"/><text class="lab" x="${CW - CR - 4}" y="${(y(t.line) - 7).toFixed(1)}" text-anchor="end">${esc(t.lineLabel)}: ${esc(num(t.line))}</text>` : '';
    const ticks = t.bars.map((b, i) => `<text class="ax" x="${(CL + slot * i + slot / 2).toFixed(1)}" y="${CH - 12}" text-anchor="middle">${esc(b.label)}</text>`).join('');
    return `<svg class="chart barschart" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="A bar chart with one bar for each of four years.">
      ${bars}<line class="axis" x1="${CL}" y1="${zero.toFixed(1)}" x2="${CW - CR}" y2="${zero.toFixed(1)}"/>${line}${ticks}
    </svg>`;
  }

  /* ---------- base year chart: real and nominal cross at the base year ---------- */
  function baseSVG(t) {
    chartSize();
    const c = t.chart, n = c.years.length, b = c.base;
    const xAt = (i) => CL + 30 + i * ((CW - CL - CR - 60) / (n - 1));
    const real = (i) => 0.42 + 0.05 * (i - b), nom = (i) => 0.42 + 0.12 * (i - b);
    const line = (fn) => c.years.map((y, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)} ${cy(fn(i)).toFixed(1)}`).join(' ');
    const ticks = c.years.map((y, i) => `<line class="tick" x1="${xAt(i)}" y1="${CH - CB}" x2="${xAt(i)}" y2="${CH - CB + 6}"/><text class="ax" x="${xAt(i)}" y="${CH - 12}" text-anchor="middle">${y}</text>`).join('');
    const lastI = n - 1;
    const upLab = c.hideNames ? (c.swap ? 'Line B' : 'Line A') : 'Nominal GDP', loLab = c.hideNames ? (c.swap ? 'Line A' : 'Line B') : 'Real GDP';
    const baseLine = c.pickLine ? '' : `<line class="baseline" x1="${xAt(b)}" y1="${CT}" x2="${xAt(b)}" y2="${CH - CB}"/>`;
    return `<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Two lines of GDP over five years.">
      <line class="axis" x1="${CL}" y1="${CT}" x2="${CL}" y2="${CH - CB}"/><line class="axis" x1="${CL}" y1="${CH - CB}" x2="${CW - CR}" y2="${CH - CB}"/>
      <text class="ax" transform="translate(16 ${(CH - CB) / 2 + 6}) rotate(-90)" text-anchor="middle">GDP</text>
      ${ticks}
      <path class="act" d="${line(nom)}"/><path class="pot strong" d="${line(real)}"/>
      <text class="lab" x="${xAt(lastI) + 2}" y="${cy(nom(lastI)) + (nom(lastI) > 0.8 ? 24 : -10)}" text-anchor="end">${upLab}</text>
      <text class="lab" x="${xAt(lastI) + 2}" y="${cy(real(lastI)) + 24}" text-anchor="end">${loLab}</text>
      ${baseLine}
    </svg>`;
  }

  /* ---------- graphs added Nov 17, 2026: the PPC, supply and demand, and a line of the inflation rate ----------
     The PPC and supply and demand share one frame: the axis names sit at the ends of the axes, so the space beside
     the axes is free for P and Q labels. What moves after the answer is moved by CSS on .chart.revealed. */
  function graphFrame() {
    const phone = window.innerWidth < 620;
    const W = phone ? 400 : 520, H = phone ? 300 : 330;
    return { W, H, L: 46, R: W - 34, T: 30, Bm: H - 32 };
  }
  const frameAxes = (f, yName, xName) => `<line class="axis" x1="${f.L}" y1="${f.T - 8}" x2="${f.L}" y2="${f.Bm}"/><line class="axis" x1="${f.L}" y1="${f.Bm}" x2="${f.R + 10}" y2="${f.Bm}"/>
      <text class="ax" x="6" y="${f.T - 12}">${esc(yName)}</text><text class="ax" x="${f.R + 28}" y="${f.Bm + 23}" text-anchor="end">${esc(xName)}</text>`;
  const tapMark = (i, X, Y, num, r) => `<g class="mk tap" data-mk="${i}" data-act="pick" data-i="${i}" role="button" aria-label="${esc(num.aria)}"><circle class="mk-hit" cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${r + 9}"/><circle class="mk-dot" cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${r}"/>${num.text ? `<text class="mk-num" x="${X.toFixed(1)}" y="${(Y + 6.5).toFixed(1)}" text-anchor="middle">${num.text}</text>` : ''}</g>`;

  /* The PPC is a quarter circle of radius 1. Inside it is a recession, on it is potential real GDP. */
  const PPC_START = { on: [0.7071, 0.7071], inside: [0.42, 0.42] };
  const PPC_GROW = { out: 1.2, in: 0.8 };
  function ppcSVG(t) {
    const f = graphFrame(), c = t.chart, M = 1.3;
    const X = (x) => f.L + (x / M) * (f.R - f.L), Y = (y) => f.Bm - (y / M) * (f.Bm - f.T);
    const arc = (r, cls, style) => `<path class="${cls}"${style ? ` style="${style}"` : ''} d="M${X(0).toFixed(1)},${Y(r).toFixed(1)} A${(X(r) - X(0)).toFixed(1)} ${(Y(0) - Y(r)).toFixed(1)} 0 0 1 ${X(r).toFixed(1)},${Y(0).toFixed(1)}"/>`;
    let inner = '';
    if (c.pickOne) {
      inner = arc(1, 'curve') + `<text class="lab" x="${(X(1) + 8).toFixed(1)}" y="${(Y(0.1)).toFixed(1)}">PPC</text>`
        + c.points.map((p, i) => tapMark(i, X(p.x), Y(p.y), { text: i + 1, aria: 'Point ' + (i + 1) }, 17)).join('');
    } else {
      const [sx, sy] = PPC_START[c.dot];
      const grow = c.curve ? PPC_GROW[c.curve] : 1;
      const end = c.to ? PPC_START[c.to] : [sx * grow, sy * grow];
      const dx = X(end[0]) - X(sx), dy = Y(end[1]) - Y(sy);
      inner = (c.curve ? arc(1, 'curve was') : '')
        + arc(1, `curve${c.curve ? ' grows' : ''}`, c.curve ? `--grow:${grow};transform-origin:${X(0).toFixed(1)}px ${Y(0).toFixed(1)}px` : '')
        + `<text class="lab" x="${(X(1) + 8).toFixed(1)}" y="${Y(0.1).toFixed(1)}">PPC</text>`
        + (c.curve ? `<text class="lab late go" x="${(f.L + 12).toFixed(1)}" y="${(Y(grow) + 24).toFixed(1)}">New PPC</text>` : '')
        + `<circle class="ghost late" cx="${X(sx).toFixed(1)}" cy="${Y(sy).toFixed(1)}" r="12"/>`
        + `<g class="econ moves" style="--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px"><circle class="econ-dot" cx="${X(sx).toFixed(1)}" cy="${Y(sy).toFixed(1)}" r="12"/>${c.curve === 'in' ? `<text class="lab" x="${(X(sx) - 17).toFixed(1)}" y="${(Y(sy) + 24).toFixed(1)}" text-anchor="end">Economy</text>` : `<text class="lab" x="${(X(sx) + 18).toFixed(1)}" y="${(Y(sy) + 6).toFixed(1)}">Economy</text>`}</g>`;
    }
    return `<svg class="chart graph ppc" viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="A production possibilities curve. Capital goods are on the side axis and consumer goods are on the bottom axis.">
      ${frameAxes(f, 'Capital goods', 'Consumer goods')}${inner}</svg>`;
  }

  /* Supply and demand. Demand is P = 10 - Q, supply is P = Q, equilibrium is 5 and 5. */
  let sdId = 0;
  function sdSVG(t) {
    const f = graphFrame(), c = t.chart, id = 'sdclip' + (++sdId);
    const X = (q) => f.L + (q / 10) * (f.R - f.L), Y = (p) => f.Bm - (p / 10) * (f.Bm - f.T);
    const lo = c.shift ? 2.2 : 1.6, hi = 10 - lo;
    const dPath = `M${X(lo).toFixed(1)},${Y(hi).toFixed(1)} L${X(hi).toFixed(1)},${Y(lo).toFixed(1)}`;
    const sPath = `M${X(lo).toFixed(1)},${Y(lo).toFixed(1)} L${X(hi).toFixed(1)},${Y(hi).toFixed(1)}`;
    const dLab = (n, cls) => `<text class="lab dem-t ${cls || ''}" x="${(X(hi) + 7).toFixed(1)}" y="${(Y(lo) + 6).toFixed(1)}">D${n}</text>`;
    const sLab = (n, cls) => `<text class="lab sup-t ${cls || ''}" x="${(X(hi) + 7).toFixed(1)}" y="${(Y(hi) + 6).toFixed(1)}">S${n}</text>`;
    const sub = (n) => `<tspan class="late" font-size="12" dy="4">${n}</tspan>`;
    const guide = (q, p, n, cls) => `<g class="${cls}"><path class="guide" d="M${f.L},${Y(p).toFixed(1)} H${X(q).toFixed(1)} V${f.Bm}"/><text class="lab" x="${f.L - 6}" y="${(Y(p) + 6).toFixed(1)}" text-anchor="end">P${n}</text><text class="lab" x="${X(q).toFixed(1)}" y="${f.Bm + 21}" text-anchor="middle">Q${n}</text></g>`;
    let inner = '', curves = '';
    if (c.shift) {
      const a = c.shift.d * 2, px = (a / 10) * (f.R - f.L);
      const isD = c.shift.c === 'D';
      const q2 = 5 + a / 2, p2 = isD ? 5 + a / 2 : 5 - a / 2;
      const still = isD ? `<path class="curve sup" d="${sPath}"/>${sLab('')}` : `<path class="curve dem" d="${dPath}"/>${dLab('')}`;
      const was = isD ? `<path class="curve dem was" d="${dPath}"/><text class="lab dem-t" x="${(X(hi) + 7).toFixed(1)}" y="${(Y(lo) + 6).toFixed(1)}">D${sub(1)}</text>` : `<path class="curve sup was" d="${sPath}"/><text class="lab sup-t" x="${(X(hi) + 7).toFixed(1)}" y="${(Y(hi) + 6).toFixed(1)}">S${sub(1)}</text>`;
      const mover = `<g class="slides" style="--dx:${px.toFixed(1)}px"><path class="curve ${isD ? 'dem' : 'sup'}" d="${isD ? dPath : sPath}"/><text class="lab ${isD ? 'dem-t' : 'sup-t'} late" x="${(X(hi) + 7).toFixed(1)}" y="${((isD ? Y(lo) : Y(hi)) + 6).toFixed(1)}">${isD ? 'D' : 'S'}<tspan font-size="12" dy="4">2</tspan></text></g>`;
      curves = `${still}${was}${mover}`;
      inner = `${guide(5, 5, sub(1), '')}${guide(q2, p2, '<tspan font-size="12" dy="4">2</tspan>', 'late')}`;
      curves += `<circle class="eq" cx="${X(5).toFixed(1)}" cy="${Y(5).toFixed(1)}" r="7"/><circle class="eq new late" cx="${X(q2).toFixed(1)}" cy="${Y(p2).toFixed(1)}" r="8"/>`;
    } else {
      const k = c.control, y = Y(k.p), binds = k.type === 'ceiling' ? k.p < 5 : k.p > 5;
      const name = c.labor ? 'Minimum wage' : k.type === 'ceiling' ? 'Price ceiling' : 'Price floor';
      const above = k.p > 5;
      const qd = 10 - k.p, qs = k.p, x1 = X(Math.min(qd, qs)), x2 = X(Math.max(qd, qs));
      const by = above ? y - 13 : y + 13;
      const result = binds
        ? `<g class="late"><path class="bracket" d="M${x1.toFixed(1)},${(by + (above ? 7 : -7)).toFixed(1)} V${by.toFixed(1)} H${x2.toFixed(1)} V${(by + (above ? 7 : -7)).toFixed(1)}"/><text class="lab" x="${((x1 + x2) / 2).toFixed(1)}" y="${(above ? by - 8 : by + 19).toFixed(1)}" text-anchor="middle">${above ? 'Surplus' : 'Shortage'}</text>
            <circle class="eq new" cx="${X(qd).toFixed(1)}" cy="${y.toFixed(1)}" r="6"/><circle class="eq new" cx="${X(qs).toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>
            <path class="guide" d="M${X(qd).toFixed(1)},${y.toFixed(1)} V${f.Bm}"/><path class="guide" d="M${X(qs).toFixed(1)},${y.toFixed(1)} V${f.Bm}"/>
            <text class="lab" x="${X(qd).toFixed(1)}" y="${f.Bm + 21}" text-anchor="middle">Qd</text><text class="lab" x="${X(qs).toFixed(1)}" y="${f.Bm + 21}" text-anchor="middle">Qs</text></g>`
        : `<g class="late"><circle class="ring" cx="${X(5).toFixed(1)}" cy="${Y(5).toFixed(1)}" r="15"/><text class="lab" x="${(X(5) + 30).toFixed(1)}" y="${(Y(5) + 6).toFixed(1)}">Stays here</text></g>`;
      inner = `<path class="curve dem" d="${dPath}"/>${dLab('')}<path class="curve sup" d="${sPath}"/>${sLab('')}
        <line class="control" x1="${f.L}" x2="${f.W - 8}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>
        <text class="lab" x="${f.W - 8}" y="${(above ? y + 21 : y - 9).toFixed(1)}" text-anchor="end">${name}</text>
        <circle class="eq" cx="${X(5).toFixed(1)}" cy="${Y(5).toFixed(1)}" r="7"/>${result}`;
    }
    const yName = c.labor ? 'Wage' : 'Price', xName = c.labor ? 'Workers' : 'Quantity';
    return `<svg class="chart graph sd" viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="A supply and demand graph. Demand slopes down and supply slopes up.">
      <defs><clipPath id="${id}"><rect x="${f.L}" y="${f.T - 10}" width="${f.R - f.L + 34}" height="${f.Bm - f.T + 10}"/></clipPath></defs>
      ${frameAxes(f, yName, xName)}${inner}<g clip-path="url(#${id})">${curves}</g></svg>`;
  }

  /* One point a year, joined by a line, with the number on every point and a line at zero. */
  function lineSVG(t) {
    chartSize();
    const pts = t.chart.pts, vals = pts.map((p) => p.v);
    const hi = Math.max(...vals, 0), lo = Math.min(...vals, 0);
    const top = CT + 30, bottom = CH - CB - (lo < 0 ? 30 : 4);
    const y = (v) => bottom - (v - lo) / ((hi - lo) || 1) * (bottom - top);
    const n = pts.length, slot = (CW - CL - CR) / n;
    const x = (i) => CL + slot * i + slot / 2;
    const num = (v) => `${v < 0 ? B.MINUS : ''}${Math.abs(v)}${t.chart.suf || ''}`;
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
    const marks = pts.map((p, i) => tapMark(i, x(i), y(p.v), { text: '', aria: p.label }, 12)
      + `<text class="bar-val" x="${x(i).toFixed(1)}" y="${(p.v < 0 ? y(p.v) + 32 : y(p.v) - 19).toFixed(1)}" text-anchor="middle">${esc(num(p.v))}</text>`).join('');
    const ticks = pts.map((p, i) => `<text class="ax" x="${x(i).toFixed(1)}" y="${CH - 12}" text-anchor="middle">${esc(p.label)}</text>`).join('');
    return `<svg class="chart graph linechart" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="A line chart of the inflation rate, one point for each of ${n} years.">
      <line class="axis" x1="${CL}" y1="${CT}" x2="${CL}" y2="${CH - CB}"/><line class="axis zero" x1="${CL}" y1="${y(0).toFixed(1)}" x2="${CW - CR}" y2="${y(0).toFixed(1)}"/>
      <text class="ax" transform="translate(16 ${(CH - CB) / 2 + 6}) rotate(-90)" text-anchor="middle">Inflation rate</text>
      ${lo < 0 ? `<text class="ax" x="${CL - 6}" y="${(y(0) + 5).toFixed(1)}" text-anchor="end">0</text>` : ''}
      <path class="trend" d="${path}"/>${marks}${ticks}
    </svg>`;
  }

  /* ---------- circular flow: same geometry as the review sheet. Inner loop real, outer loop money. ---------- */
  const FLOW_PATHS = [
    'M520 130 L520 80 L120 80 L120 130',
    'M70 130 L70 34 L570 34 L570 130',
    'M120 210 L120 262 L520 262 L520 210',
    'M570 210 L570 308 L70 308 L70 210',
  ];
  const FLOW_BADGE = [[420, 80], [190, 34], [190, 262], [420, 308]];
  function flowSVG() {
    const arrows = FLOW_PATHS.map((d, i) => {
      const real = i === 0 || i === 2;
      const [bx, by] = FLOW_BADGE[i];
      return `<g class="arrow ${real ? 'real' : 'money'}" data-arrow="${i}" data-act="pick" data-i="${i}" role="button" aria-label="Arrow ${i + 1}">
        <path class="arrow-hit" d="${d}"/><path class="arrow-line" d="${d}" marker-end="url(#ah${real ? 'r' : 'm'})"/>
        <circle class="arrow-badge" cx="${bx}" cy="${by}" r="22"/><text class="arrow-num" x="${bx}" y="${by + 9}" text-anchor="middle">${i + 1}</text>
      </g>`;
    }).join('');
    return `<svg class="chart flow" id="flowsvg" viewBox="0 0 640 342" role="img" aria-label="The circular flow: households on the left, firms on the right, the product market on top, the factor market on the bottom.">
      <defs>
        <marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="ah real"/></marker>
        <marker id="ahm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="ah money"/></marker>
      </defs>
      ${arrows}
      <g class="node"><rect x="8" y="130" width="154" height="80" rx="4"/><text x="85" y="179" text-anchor="middle">Households</text></g>
      <g class="node"><rect x="478" y="130" width="154" height="80" rx="4"/><text x="555" y="179" text-anchor="middle">Firms</text></g>
      <g class="node mkt"><rect x="240" y="16" width="160" height="82" rx="4"/><text x="320" y="51" text-anchor="middle">Product</text><text x="320" y="79" text-anchor="middle">market</text></g>
      <g class="node mkt"><rect x="240" y="244" width="160" height="82" rx="4"/><text x="320" y="279" text-anchor="middle">Factor</text><text x="320" y="307" text-anchor="middle">market</text></g>
      <text class="flow-key" x="320" y="162" text-anchor="middle">Inner: real things</text>
      <text class="flow-key" x="320" y="192" text-anchor="middle">Outer: money</text>
    </svg>`;
  }
  function flowLabelSVG() {
    const arrows = FLOW_PATHS.map((d, i) => {
      const real = i === 0 || i === 2;
      const [bx, by] = FLOW_BADGE[i];
      return `<g class="arrow labelspot ${real ? 'real' : 'money'}" data-spot="${i}"><path class="arrow-line" d="${d}" marker-end="url(#ah${real ? 'r' : 'm'})"/><circle class="arrow-badge" cx="${bx}" cy="${by}" r="22"/><text class="arrow-num" x="${bx}" y="${by + 9}" text-anchor="middle">?</text></g>`;
    }).join('');
    return `<svg class="chart flow" id="flowsvg" viewBox="0 0 640 342" role="img" aria-label="The circular flow with parts to name.">
      <defs>
        <marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="ah real"/></marker>

  /* ================= calculator ================= */
  /* A four-function calculator with parentheses, like the one allowed on the AP exam. The math is B.calcEval.

  const Calc = { open: false, expr: '', prev: '', shown: '', done: false, err: false };

    let e = Calc.expr;

    if (Calc.done && Calc.err && CALC_OPS.includes(k)) e = '';
    Calc.done = false; Calc.err = false;
    const last = e.slice(-1), opens = (e.match(/\(/g) || []).length - (e.match(/\)/g) || []).length;
    if (k === 'C') { e = ''; Calc.prev = ''; }
    else if (k === 'back') e = e.slice(0, -1);

  const isRight = (t, c) => {

  /* verdict: every answer waits for Next. The clock only runs during a task, so there is always time to read why. */
  /* The formula, or the rule where there is no formula, shown with every answer so students learn it (asked for Nov 17, 2026).
     Left off when the line above already says the same thing. */
  const learnHTML = (t) => {
    const l = t && t.learn;
    const bare = (x) => String(x || '').replace(/\.$/, '');
    if (!l || bare(t.why).includes(bare(l.text)) || bare(t.work).includes(bare(l.text))) return '';
    return `<p class="v-learn"><b>${esc(l.label)}:</b> ${esc(l.text)}</p>`;
  };
  function showVerdict(v) {
    const slot = $('#verdict-slot'); if (!slot) return;
    const t = Run.t;
    const face_ = face(v.right ? 'glad' : 'mad');
    const showWork = t.work && t.work !== t.why && !String(t.why || '').includes(t.work) && !(v.right && !['pick', 'build', 'town', 'type', 'dial', 'rows'].includes(t.verb));
    const work = showWork ? `<p class="v-work">${esc(t.work)}</p>` : '';
    const said = v.right ? '' : youSaid(t, Run.choice);
    const ans = v.right ? '' : `${said ? `<p class="v-you">You said: ${esc(said)}</p>` : ''}<p class="v-ans">The answer: <b>${esc(answerText(t))}</b></p>`;
    const pickedText = !v.right && t.verb === 'pick' && v.picked != null && t.options[v.picked] ? t.options[v.picked].why : !v.right && t.verb === 'type' ? Run.typedWhy : '';
    const pickedWhy = pickedText ? `<p class="v-why small">${esc(pickedText)}</p>` : '';
    const tag = v.amount ? `<span class="v-amt${v.right ? '' : ' bad'}">${esc(v.amount)}</span>` : '';
    const nextBtn = `<button type="button" class="btn main v-next" data-act="next">${esc(v.next || 'Next')}</button>`;
    slot.innerHTML = `<aside class="verdict ${v.right ? 'right' : 'wrong'}">
      ${face_}
      <div class="v-text"><p class="v-head"><b>${esc(v.head)}</b>${tag}</p>${ans}${pickedWhy}<p class="v-why">${esc(!v.right && Run.whyOverride ? Run.whyOverride : t.why)}</p>${work}${learnHTML(t)}${v.note ? `<p class="v-note">${esc(v.note)}</p>` : ''}</div>
      ${nextBtn}
    </aside>`;
    Run.onNext = v.onNext;
    const nb = $('.v-next');
    if (nb) { lock(350); try { nb.focus({ preventScroll: true }); } catch (e) { nb.focus(); } }
    if (!v.right) { const task = $('.task'); if (task && !reduced() && task.animate) task.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(0)' }], { duration: 260 }); }
    const vd = $('.verdict'); if (vd && vd.scrollIntoView) { try { vd.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ } }
  }
  function goNext() {
    clearTimers();
    document.body.classList.remove('answered');
    const fn = Run.onNext; Run.onNext = null;
    if (fn) fn();
  }

  /* ================= HUD and tray ================= */
  function renderHud() {
    const h = $('#hud'); if (!h) return;
    if (S.mode === 'solo' && S.solo && (S.screen === 'task' || S.screen === 'promo' || S.screen === 'bossintro')) {
      const so = S.solo, rk = RANKS[so.rank];
      const slips = [0, 1, 2].map((i) => `<i class="slip ${i < so.slips ? 'on' : ''}"></i>`).join('');
      const streak = B.streakMult(so.streak) > 1 ? `<span class="hud-streak">×${B.streakMult(so.streak)} streak</span>` : '';
      h.hidden = false;
      h.className = 'hud solo';
      h.innerHTML = `<div class="hud-rank"><b>${esc(so.overtime ? 'Overtime' : rk.name)}</b><span>${so.boss ? 'The Release' : so.overtime ? 'No promotions left' : `Task ${Math.min(so.inRank + 1, 6)} of 6`}</span></div>
        <div class="hud-slips" role="img" aria-label="Pink slips: ${so.slips} of 3"><div class="slips">${slips}</div><span>${so.slips} of 3 pink slips</span></div>
        <div class="hud-money"><span class="hud-lab">Pay</span><b id="hud-pay">${fmt.usd(so.pay)}</b><span>CPI ${so.cpi}${streak}</span></div>`;
      return;
    }
    if (S.mode === 'class' && S.cup && ['task', 'call', 'turnend', 'half', 'final'].includes(S.screen)) { renderScoreboard(h); return; }
    if (S.mode === 'train' && S.screen === 'task' && S.train) {
      h.hidden = false; h.className = 'hud solo';
      h.innerHTML = `<div class="hud-rank"><b>Training room</b><span>No clock, no pink slips</span></div><div class="hud-money"><b>${S.train.right} of ${S.train.total}</b><span>right so far</span></div>`;
      return;
    }
    if (S.screen === 'review' && S.solo) {
      h.hidden = false; h.className = 'hud solo';
      const so = S.solo;
      h.innerHTML = `<div class="hud-rank"><b>Review my misses</b><span>No clock, no pay</span></div><div class="hud-money"><b>${so.reviewAt + 1} of ${so.misses.length}</b><span>${so.second.right} right so far</span></div>`;
      return;
    }
    h.hidden = true;
    h.innerHTML = '';
  }
  function renderTray(spec) {
    const f = $('#tray'); if (!f) return;
    if (!spec) { f.hidden = true; f.innerHTML = ''; return; }
    f.hidden = false;
    f.innerHTML = `<p class="doline">${esc(spec.line)}</p>${spec.extra || ''}${spec.main ? `<button type="button" class="btn main" data-act="${esc(spec.act)}">${esc(spec.main)}</button>` : ''}`;
  }
  function setScreen(name, wallName, html, tray) {
    clearTimers();
    Clock.hide();
    document.body.classList.remove('answered');
    S.screen = name;
    calcToggle(false);
    wall(wallName);
    stage().innerHTML = html;
    stage().scrollTop = 0;
    renderHud();
    renderTray(tray || null);
    lock(350);
    Sound.undip();
    soundScene();
    paintAudio();
  }

  /* paper confetti: DOM pieces, gone in under 3 seconds */
  function confetti(n) {
    if (reduced()) return;
    const box = document.createElement('div');
    box.className = 'confetti';
    const colors = ['var(--paper)', 'var(--slip)', 'var(--bond)', '#7DE2C0'];
    for (let i = 0; i < (n || 34); i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * 0.6 + 's';
      p.style.animationDuration = 1.2 + Math.random() * 0.8 + 's';
      p.style.setProperty('--r', Math.round(Math.random() * 720 - 360) + 'deg');
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2600);
  }

  /* ================= Solo ================= */
  const TASKS_PER_RANK = 6;
  const BOSS_AT = { 1: 0, 3: 1, 5: 3 }; // rank: boss tier
  const PERKS = [
    { id: 'coffee', name: 'Extra coffee', text: 'Every clock runs 30% longer this rank.' },
    { id: 'cheat', name: 'Cheat sheet', text: 'Math tasks show the formula this rank.' },
    { id: 'second', name: 'Second opinion', text: 'One wrong answer is crossed out on most tasks this rank.' },
    { id: 'overtime', name: 'Overtime', text: 'Pay doubles this rank. Clocks run 15% faster.' },
    { id: 'cola', name: 'Cost-of-living raise', text: 'Your pay rises with prices this rank, so misses do not raise your CPI.' },
    { id: 'lunch', name: 'Long lunch', text: 'Skip one task this rank. No pay, no pink slip.' },
  ];

  function newRun() {
    const seed = ((Date.now() & 0xffffffff) ^ Math.floor(Math.random() * 1e9)) >>> 0;
    const r = B.rng(seed);
    const seen = new Set(prefs.seen || []);
    S.mode = 'solo';
    S.solo = {
      r, sch: B.scheduler(r, { seen }), seen, rank: 0, inRank: 0, slips: 0, pay: 0, cpi: 100, streak: 0, bestStreak: 0, right: 0, total: 0,
      byDesk: {}, misses: [], perk: null, lunchUsed: false, boss: null, bossRight: 0, overtime: false, startedAt: Date.now(), status: null, bonus: 0, second: { right: 0, total: 0, skipped: 0 }, reviewAt: 0,
    };
  }
  function soloStart() {
    if (!prefs.practiced) { orientation(); return; }
    newRun();
    soloNext();
  }
  function orientation() {
    S.mode = 'solo-intro';
    setScreen('orientation', 'home', `<section class="sheet">
      <div class="sheet-head">${face('neutral')}<div><h1 class="big">Welcome to the Bureau.</h1><p>I am the Commissioner. Here is the job.</p></div></div>
      <ol class="rules">
        <li><b>Do each task before the clock runs out.</b> A clock bar runs across the top. It stops after you answer, and nothing moves on until you tap Next. Fast answers, streaks, and math tasks pay more.</li>
        <li><b>Miss one and you get a pink slip.</b> That is a firing notice. Three and you are fired. Every promotion tears one up.</li>
        <li><b>Every miss also raises your CPI 10 points,</b> and it never comes back down. Your score is your real pay: pay ÷ CPI × 100.</li>
      </ol>
      <p class="sheet-note">Start as an Intern. Try to make Commissioner. Every shift deals a new random mix, and you never need to see them all to win.</p>
    </section>`, { line: 'Try one task first. It does not count.', main: 'Try one', act: 'practice' });
  }
  function practiceTask() {
    prefs.practiced = true; savePrefs();
    S.mode = 'solo-intro';
    const t = B.oneTask('counted', 'slice', B.rng(Date.now() >>> 0));
    startTask(t, { hints: true, banner: 'Practice. This one does not count.' }, (correct) => {
      if (!correct) revealAnswer(t);
      showVerdict({ right: correct, head: correct ? 'Right. That is the job.' : 'That would be a pink slip.', next: 'Clock in', onNext: () => { newRun(); soloNext(); } });
    });
  }
  function soloNext() {
    const so = S.solo;
    if (so.slips >= 3) { fired(); return; }
    if (so.boss && so.boss.at < so.boss.steps.length) { runBossStep(); return; }
    if (so.boss) { finishBoss(); return; }
    if (so.overtime) { runSoloTask(so.sch.next(5)); return; }
    if (so.inRank < TASKS_PER_RANK) { runSoloTask(so.sch.next(so.rank)); return; }
    if (BOSS_AT[so.rank] != null && !so['bossDone' + so.rank]) { bossIntro(BOSS_AT[so.rank]); return; }
    if (so.rank >= RANKS.length - 1) { soloWin(); return; }
    promotion();
  }
  function clockFor(t, boss) {
    const so = S.solo, rk = RANKS[so.overtime ? 5 : so.rank];
    let c = t.clock * rk.speed;
    if (so.perk === 'coffee') c *= 1.3;
    if (so.perk === 'overtime') c *= 0.85;
    if (prefs.extra) c *= 1.5;
    if (boss) c *= 1.25;
    if (so.overtime) c *= 0.9;
    return Math.max(4, c);
  }
  function runSoloTask(t) {
    const so = S.solo, rk = RANKS[so.rank];
    startTask(t, {
      clock: clockFor(t, false), hints: rk.hints, formula: so.perk === 'cheat', strike: so.perk === 'second',
      skip: so.perk === 'lunch' && !so.lunchUsed,
    }, (correct, choice, left) => soloAnswered(t, correct, choice, left, false));
  }
  function deskStat(so, t, correct) {
    const d = so.byDesk[t.desk] = so.byDesk[t.desk] || { r: 0, n: 0 };
    d.n++; if (correct) d.r++;
  }
  function saveSeen() {
    prefs.seen = Array.from(S.solo.seen).slice(-2000);
    savePrefs();
  }
  function soloAnswered(t, correct, choice, left, boss) {
    const so = S.solo, rk = RANKS[so.rank];
    if (!t.again) { so.total++; if (correct) so.right++; deskStat(so, t, correct); }
    if (!boss) so.inRank++;
    if (correct) {
      so.streak++;
      so.bestStreak = Math.max(so.bestStreak, so.streak);
      const perkMult = so.perk === 'overtime' ? 2 : 1;
      const overtimeMult = so.overtime ? 1.5 : 1;
      const amount = B.payFor({ base: rk.base * perkMult * overtimeMult, mult: t.pay * (boss ? 1.25 : 1), left, streak: so.streak });
      so.pay += amount;
      if (boss) so.boss.right++;
      renderHud();
      const hot = so.streak >= 5 && so.streak % 5 === 0;
      showVerdict({ right: true, head: hot ? lineFor('hot') : lineFor('right'), amount: '+' + fmt.usd(amount), onNext: soloNext });
    } else {
      revealAnswer(t);
      so.streak = 0;
      const cola = so.perk === 'cola';
      if (!boss) so.slips++;
      if (!cola) so.cpi += 10;
      if (!so.misses.some((m) => m.id === t.id)) so.misses.push(t);
      if (!boss && !t.again) so.sch.miss(t);
      so.lastStraw = { text: t.text || t.order, answer: answerText(t) };
      renderHud();
      const chip = cola ? 'Your CPI stays put' : 'Your CPI +10';
      showVerdict({ right: false, head: boss ? 'Wrong number.' : `${lineFor('wrong')} Pink slip ${so.slips} of 3.`, amount: chip, picked: typeof choice === 'number' ? choice : null, onNext: soloNext });
    }
    saveSeen();
  }
  function promotion() {
    const so = S.solo;
    so.rank++; so.inRank = 0; so.perk = null; so.lunchUsed = false;
    const tore = so.slips > 0;
    if (tore) so.slips--;
    const offer = B.shuffle(so.r, PERKS).slice(0, 3);
    S.screen = 'promo';
    Sound.play('promoted', { level: so.rank, tore });
    setScreen('promo', 'promo', `<section class="sheet promo">
      <span class="promo-stamp">Promoted</span>
      <h1 class="big">${esc(RANKS[so.rank].name)}</h1>
      <p class="promo-line">${tore ? 'One pink slip torn up. ' : ''}You earn more per task now, and the clocks get a little shorter.</p>
      <h2 class="q">Pick one perk for this rank</h2>
      <div class="perks">${offer.map((p, i) => `<button type="button" class="perk" data-act="perk" data-id="${p.id}" data-key="${i + 1}"><kbd>${i + 1}</kbd><b>${esc(p.name)}</b><span>${esc(p.text)}</span></button>`).join('')}</div>
    </section>`, { line: 'Pick one perk for this rank.' });
    confetti();
  }
  function choosePerk(id) {
    S.solo.perk = id;
    soloNext();
  }
  function bossIntro(tier) {
    const so = S.solo;
    const steps = B.boss(tier, so.r);
    so.boss = { tier, steps, at: 0, right: 0 };
    so.boss.waiting = true;
    const title = steps[0].title;
    const frq = tier >= 3;
    setScreen('bossintro', 'boss', `<section class="sheet bossintro">
      <p class="boss-clock" aria-hidden="true">8:29</p>
      <h1 class="big">${esc(title)}</h1>
      <p>${frq ? 'One country, five parts, like the free-response question on Monday. Each answer leads to the next. Scrap paper and a calculator are fine.' : `The numbers go out at 8:30. ${steps.length} steps, and each one leads to the next. Scrap paper and a calculator are fine.`}</p>
      <p class="sheet-note">A wrong step does not get a pink slip, but your prices jump. Get every step right and one pink slip is torn up, plus a bonus.</p>
    </section>`, { line: 'Read the numbers on the next screen, then go.', main: 'Start the release', act: 'boss-go' });
  }
  function runBossStep() {
    const so = S.solo, b = so.boss;
    const t = b.steps[b.at];
    b.at++;
    startTask(t, { clock: clockFor(t, true), hints: false, formula: so.perk === 'cheat', strike: so.perk === 'second', boss: true },
      (correct, choice, left) => { if (correct) b.right++; soloAnswered(t, correct, choice, left, true); });
  }
  function finishBoss() {
    const so = S.solo, b = so.boss;
    const clean = b.right >= b.steps.length;
    const bonus = clean ? RANKS[so.rank].base * 5 : 0;
    so['bossDone' + so.rank] = true;
    so.boss = null;
    if (clean) { so.pay += bonus; if (so.slips > 0) so.slips--; }
    if (clean) { Sound.play('release', { level: so.rank }); confetti(20); }
    setScreen('bossdone', 'boss', `<section class="sheet bossintro">
      <p class="boss-clock" aria-hidden="true">8:30</p>
      <h1 class="big">${clean ? 'Clean release.' : 'It went out.'}</h1>
      <p>${clean ? `Every step right. Bonus: ${fmt.usd(bonus)}. One pink slip torn up.` : `You got ${b.right} of ${b.steps.length} steps right. The Commissioner has notes.`}</p>
    </section>`, { line: 'Back to your desk.', main: 'Next', act: 'solo-next' });
  }
  function fired() {
    const so = S.solo;
    Sound.play('fired');
    setScreen('fired', 'fired', `<section class="sheet fired">
      <h1 class="huge">You are fired.</h1>
      ${so.lastStraw ? `<article class="firing"><p class="firing-h">Reason for firing</p><p>${esc(so.lastStraw.text)}</p><p class="firing-a">The answer was: <b>${esc(so.lastStraw.answer)}</b></p></article>` : ''}
      <div class="sheet-head">${face('mad')}<p>Three pink slips, ${esc(RANKS[so.rank].name)}. Clean out your desk. One last question for the survey: are you looking for a new job?</p></div>
      <div class="twochoice">
        <button type="button" class="stampbtn go" data-act="status" data-v="look" data-key="1"><kbd>1</kbd><span>Yes, I am looking</span></button>
        <button type="button" class="stampbtn no" data-act="status" data-v="quit" data-key="2"><kbd>2</kbd><span>No, I give up</span></button>
      </div>
    </section>`, { line: 'Answer the survey.' });
  }
  function statusChosen(v) {
    const so = S.solo;
    so.status = v;
    const look = v === 'look';
    setScreen('status', 'fired', `<section class="sheet fired">
      <h1 class="big">${look ? 'You count as unemployed.' : 'You are not in the labor force.'}</h1>
      <div class="statusmap" aria-hidden="true">
        <div class="sm-box"><b>Employed</b></div>
        <div class="sm-box ${look ? 'here' : ''}"><b>Unemployed</b>${look ? '<i class="dot me2"></i>' : ''}</div>
        <div class="sm-box ${look ? '' : 'here'}"><b>Not in the labor force</b>${look ? '' : '<i class="dot me2"></i>'}</div>
      </div>
      <p>${look ? 'No job, available, and looking. You are between jobs, so this is frictional unemployment.' : 'No job, and you are not looking, so you are not in the labor force. If you gave up because you think there are no jobs, you are a discouraged worker. The unemployment rate does not count you at all.'}</p>
    </section>`, { line: 'Now see what your pay was worth.', main: 'Go to payday', act: 'payday' });
  }
  function soloWin() {
    const so = S.solo;
    Sound.play('win', { level: 5 });
    setScreen('win', 'promo', `<section class="sheet promo">
      <span class="promo-stamp">Still Employed</span>
      <h1 class="huge">Commissioner.</h1>
      <p class="promo-line">You ran the whole Bureau, ${so.right} of ${so.total} tasks right, out of over ${Math.floor(B.totalTasks() / 100) * 100} in the building. Clock out now, or keep going for more pay at top speed.</p>
      <button type="button" class="linkbtn dark" data-act="overtime">Keep going: overtime, until you are fired</button>
    </section>`, { line: 'Your shift is done.', main: 'Clock out and go to payday', act: 'payday' });
    confetti(50);
  }
  function startOvertime() {
    const so = S.solo;
    so.overtime = true; so.perk = null;
    soloNext();
  }

  /* Payday: the student works out their own real pay. */
  function payday() {
    const so = S.solo;
    const noMath = so.cpi === 100 || so.pay < 200;
    if (noMath) {
      so.real = B.realPayOf(so.pay, so.cpi);
      const line = so.cpi === 100 ? 'No pink slips ever raised your prices, so your real pay equals your pay.' : 'Your pay was too small to bother with the math. Your real pay is about the same.';
      setScreen('payday', 'promo', `<section class="sheet"><h1 class="big">Payday</h1><p class="bigline">${fmt.usd(so.pay)}</p><p>${esc(line)}</p></section>`, { line: 'See your report.', main: 'See my report', act: 'report' });
      return;
    }
    const q = B.realPayQuestion(so.pay, so.cpi, so.r);
    so.payQ = q;
    setScreen('payday', 'promo', `<section class="sheet" id="payq">
      <h1 class="big">Payday</h1>
      <div class="payrow"><div><span>Your pay</span><b>${fmt.usd(so.pay)}</b></div><div><span>Your CPI</span><b>${so.cpi}</b></div></div>
      <h2 class="q">What is your real pay? Get it right for a $250 bonus.</h2>${calcBtn()}
      <p class="sheet-note">Rounded to the nearest $10.</p>

  const TURNIN = `<div class="turnin"><p><b>To hand in this card</b> (the game does not send it): take a screenshot now, so you have a copy. Then show this screen to your teacher, or upload the screenshot to Schoology if your teacher asks.</p><p><b>Screenshot keys</b></p><ul class="keys"><li>Chromebook: Ctrl + Show windows, the top-row key that shows boxes (saved in Downloads)</li><li>Windows: Windows + Print Screen (saved in Pictures)</li><li>Mac: Shift + Command + 3 (saved on the Desktop)</li><li>iPhone: side button + volume up</li><li>Android: power + volume down</li></ul><p>This card stays saved on this device. Tap See my last card on the start screen to bring it back.</p></div>`;

  /* ================= training room ================= */
  function trainMenu() {

  /* Every formula and rule the game teaches, by topic. The same lines show under each answer. */
  function formulaSheet() {
    const from = S.screen === 'trainmenu' ? 'train-menu' : 'home';
    const blocks = B.SHEET.map((b) => `<section class="fs-desk" style="--d:var(--w-${b.desk})"><h2>${esc(DESKS[b.desk].code)} <span>${esc(DESKS[b.desk].long)}</span></h2><ul>${b.lines.map((l) => `<li>${esc(l.text)}</li>`).join('')}</ul></section>`).join('');

      { line: 'Scroll to read. Then go practice.', main: 'Back', act: from });

  function trainGo(desk) {
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;

  }
  function trainNext() {
    const tr = S.train;
    tr.n++;
    let t = null;
    const due = tr.back.findIndex((b) => tr.n >= b.due);
    if (due >= 0) t = tr.back.splice(due, 1)[0].t;
    else t = B.trainingTask(tr.desk, tr.r, tr.seen);
    startTask(t, { hints: true, formula: true, stop: 'train-stop', stopLabel: 'Stop practicing' }, (correct, choice) => {
      tr.total++; if (correct) tr.right++;
      if (!correct) { revealAnswer(t); tr.back.push({ t, due: tr.n + 3 }); }

  function trainStop() {

  }

  /* ================= the Five Towns Cup (class mode) ================= */
  const TOWNS = ['Cedarhurst', 'Hewlett', 'Inwood', 'Lawrence', 'Woodmere', 'North Woodmere'];
  const TURN_TASKS = 4;
  const FINAL_PAY = 500;
  const STEAL_MS = 8000;
  const CUP_KEY = 'still-employed:cup';
  const CUP_SKIP = ['ap', 'badcell']; // too long for one player's turn on the big screen
  const saveCup = () => { const c = S.cup; if (!c) return; const copy = Object.assign({}, c); delete copy.r; delete copy.sch; delete copy.task; delete copy.finalSteps; store.set(CUP_KEY, JSON.stringify(copy)); };
  const loadCup = () => { try { const c = JSON.parse(store.get(CUP_KEY) || 'null'); return c && c.towns && c.phase !== 'over' ? c : null; } catch (e) { return null; } };
  const clearCup = () => store.set(CUP_KEY, 'null');
  const baseForRound = (r) => [100, 150, 200, 300, 400, 500][Math.min(r, 5)];
  const estMinutes = (n, rounds) => Math.round(n * rounds * 1.8 + 7);

  function cupSetup() {
    S.mode = 'class';
    const chosen = prefs.cupTowns || TOWNS.slice(0, 5);
    S.setup = { towns: chosen.slice(), rounds: prefs.cupRounds || 3 };
    drawSetup();
  }
  function drawSetup() {
    const su = S.setup;
    const chips = TOWNS.map((t) => `<button type="button" class="townchip ${su.towns.includes(t) ? 'on' : ''}" data-act="toggle-town" data-town="${esc(t)}" aria-pressed="${su.towns.includes(t)}">${esc(t)}</button>`).join('');
    const roundBtns = [2, 3, 4, 5].map((r) => `<button type="button" class="townchip ${su.rounds === r ? 'on' : ''}" data-act="set-rounds" data-r="${r}" aria-pressed="${su.rounds === r}">${r}</button>`).join('');
    setScreen('cupsetup', 'home', `<section class="sheet">
      <h1 class="big">The Five Towns Cup</h1>
      <p>Each town is a team of 3 or 4. One player at a time works the Bureau on the big screen, four tasks a turn.</p>
      <h2 class="q">Who is playing?</h2><div class="chipline">${chips}</div>
      <h2 class="q">How many rounds? Every town plays once a round.</h2><div class="chipline">${roundBtns}</div>
      <p class="sheet-note">About ${estMinutes(su.towns.length, su.rounds)} minutes, including the final. Have whiteboards and calculators out for the final.</p>
      <div class="home-tools"><button type="button" class="linkbtn" data-act="toggle-music"></button><button type="button" class="linkbtn" data-act="toggle-sfx"></button><button type="button" class="linkbtn" data-act="home">Back</button></div>
    </section>`, { line: 'Pick the towns and rounds, then start.', main: 'Show the rules', act: 'cup-rules' });
  }
  function cupRules() {
    const su = S.setup;
    if (su.towns.length < 2) return;
    prefs.cupTowns = su.towns; prefs.cupRounds = su.rounds; savePrefs();
    setScreen('cuprules', 'home', `<section class="sheet">
      <h1 class="big">How the Cup works</h1>
      <ol class="rules big-rules">
        <li><b>One player from your town takes the computer.</b> Four tasks, then the next town goes.</li>
        <li><b>Your town can help. Rival towns can shout wrong answers</b> to throw you off. You decide who to trust.</li>
        <li><b>Miss a task and your town's CPI jumps 5 points.</b> Then rivals get eight seconds: the first to shout the right answer steals the pay. The teacher taps that town at the top of the screen.</li>
        <li><b>The winner has the highest real pay.</b> Real pay = pay ÷ CPI × 100. So the money on the board is not the whole story. After the rounds comes a final on whiteboards, for every town.</li>
      </ol>
    </section>`, { line: 'Read this out loud, then start.', main: 'Start the Cup', act: 'cup-start' });
  }
  function cupStart() {
    const su = S.setup;
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    const r = B.rng(seed);
    S.cup = {
      seed, towns: su.towns.map((name, i) => ({ name, i, pay: 0, cpi: 100, right: 0, total: 0, steals: 0 })), rounds: su.rounds, round: 0, turn: 0, inTurn: 0, turnStart: null,
      streak: 0, seen: [], missed: {}, phase: 'call', halfDone: false, finalAt: 0,
    };
    S.cup.r = r;
    S.cup.sch = B.scheduler(r, { seen: new Set(), skipVerbs: CUP_SKIP });
    clearCup();
    cupCall();
  }
  function cupEnsure() {
    const c = S.cup;
    if (!c.r) { c.r = B.rng((c.seed + c.round * 31 + c.turn * 7 + 1) >>> 0); c.sch = B.scheduler(c.r, { seen: new Set(c.seen || []), skipVerbs: CUP_SKIP }); }
  }
  function cupResume() {
    const c = loadCup();
    if (!c) { home(); return; }
    S.mode = 'class';
    S.cup = c;
    cupEnsure();
    if (c.phase === 'payday') { cupPayday(); return; }
    if (c.phase === 'final') {
      if (c.finalAt > 0 && c.finalAt < 5) { c.finalSteps = B.boss(3, c.r); finalPart(); return; }
      cupFinalIntro();
      return;
    }
    if (c.phase === 'half') { cupHalf(); return; }
    cupCall();
  }
  function renderScoreboard(h) {
    const c = S.cup;
    h.hidden = false;
    h.className = 'hud cup n' + c.towns.length;
    h.innerHTML = c.towns.map((t, i) => `<button type="button" class="town t${i} ${c.turn === i && c.phase !== 'final' ? 'up' : ''} ${c.stealOpen && i !== c.turn ? 'can-steal' : ''} ${c.finalOpen ? 'can-final' : ''} ${c.finalPicked && c.finalPicked[i] ? 'picked' : ''}" data-act="town-tap" data-i="${i}" style="--t:var(--t${i})">
      <b class="town-name">${esc(t.name)}</b><b class="town-pay">${fmt.usd(t.pay)}</b><span class="town-cpi">CPI ${t.cpi}</span></button>`).join('') + `<button type="button" class="toolsbtn" data-act="tools" aria-label="Teacher tools">Tools</button>`;
  }
  function cupCall() {
    const c = S.cup;
    c.phase = 'call';
    c.inTurn = c.inTurn || 0;
    const t = c.towns[c.turn];
    saveCup();
    setScreen('call', 'home', `<section class="sheet call" style="--t:var(--t${c.turn})">
      <p class="call-round">Round ${c.round + 1} of ${c.rounds}</p>
      <h1 class="huge call-town">${esc(t.name)}</h1>
      <p class="call-line">Send up your next player.</p>
      <p class="sheet-note">Four tasks. Your town can help. Rivals can shout wrong answers.</p>
    </section>`, { line: 'When the player is ready, tap Start.', main: `Start ${t.name}`, act: 'cup-go' });
  }
  function cupGo() {
    const c = S.cup;
    c.phase = 'turn';
    c.turnStart = { pay: c.towns[c.turn].pay, right: 0, cpi: c.towns[c.turn].cpi };
    c.streak = 0;
    c.inTurn = 0;
    cupTask();
  }
  function cupTask() {
    const c = S.cup;
    cupEnsure();
    const rankIndex = Math.min(c.round + 1, RANKS.length - 1);
    const rk = RANKS[Math.min(c.round, 3)];
    const t = c.sch.next(c.round === 0 ? 1 : rankIndex);
    c.task = t;
    c.seen.push(t.id);
    const clock = t.clock * rk.speed;
    startTask(t, { clock, hints: c.round === 0, banner: `${c.towns[c.turn].name}: task ${c.inTurn + 1} of ${TURN_TASKS}` }, (correct, choice, left) => cupAnswered(t, correct, choice, left));
  }
  function cupAnswered(t, correct, choice, left) {
    const c = S.cup, town = c.towns[c.turn], base = baseForRound(c.round);
    town.total++;
    c.inTurn++;
    if (correct) {
      c.streak++;
      town.right++;
      c.turnStart.right++;
      const amount = B.payFor({ base, mult: t.pay, left, streak: c.streak });
      town.pay += amount;
      renderHud();
      saveCup();
      showVerdict({ right: true, head: lineFor('right'), amount: '+' + fmt.usd(amount), onNext: cupAfter });
      return;
    }
    c.streak = 0;
    town.cpi += 5;
    const m = c.missed[t.id] = c.missed[t.id] || { n: 0, desk: t.desk, order: t.order, text: t.text || (t.lines ? t.lines.join(' / ') : ''), answer: answerText(t), why: t.why };
    m.n++;
    openSteal(t, base);
    renderHud();
    saveCup();
  }
  /* The steal: the key stays hidden for a few seconds so a rival can shout it. The teacher taps their town. */
  function openSteal(t, base) {
    const c = S.cup;
    c.stealOpen = true;
    c.stealShown = false;
    c.stealAmount = B.payFor({ base, mult: t.pay, left: 0.5, streak: 0 });
    Sound.play('knock');
    Sound.dipFor(0.3); // the room has to hear who shouted first
    renderHud();
    const slot = $('#verdict-slot');
    slot.innerHTML = `<aside class="verdict steal">
      ${face('mad')}
      <div class="v-text"><p class="v-head"><b>Missed. Rivals, shout the answer!</b><span class="v-amt">${fmt.usd(c.stealAmount)}</span></p><p class="v-why">The first right shout steals the pay. The answer shows when the bar runs out.</p><div class="stealbar"><i id="stealbar"></i></div></div>
      <button type="button" class="btn ghostdark v-next" data-act="no-steal">Show the answer</button>
    </aside>`;
    const bar = $('#stealbar');
    if (bar && bar.animate && !reduced()) bar.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: STEAL_MS, easing: 'linear', fill: 'forwards' });
    stealTimer = setTimeout(() => closeSteal(null), STEAL_MS);
    lock(300);
  }
  /* The town tabs stay live after the answer shows, so the teacher can check a shout before paying it. */
  function closeSteal(i) {
    Sound.undip();
    const c = S.cup;
    if (!c.stealOpen) return;
    clearTimeout(stealTimer);
    const t = Run.t;
    if (!c.stealShown) { c.stealShown = true; revealAnswer(t); }
    let head = 'The answer. Did a rival shout it first?';
    let note = 'Teacher: tap their town at the top to pay them.';
    if (i != null && i !== c.turn) {
      const thief = c.towns[i];
      thief.pay += c.stealAmount; thief.steals++;
      c.stealOpen = false;
      head = `${thief.name} steals ${fmt.usd(c.stealAmount)}.`;
      note = '';
      Sound.play('steal');
    }
    renderHud();
    saveCup();
    showVerdict({ right: false, head, note, amount: `${c.towns[c.turn].name} CPI +5`, onNext: () => { c.stealOpen = false; c.stealShown = false; renderHud(); cupAfter(); } });
  }
  function cupAfter() {
    const c = S.cup;
    if (c.inTurn >= TURN_TASKS) { cupTurnEnd(); return; }
    cupTask();
  }
  function cupTurnEnd() {
    const c = S.cup, t = c.towns[c.turn], s = c.turnStart;
    const earned = t.pay - s.pay;
    c.phase = 'turnend';
    saveCup();
    const lastTown = c.turn >= c.towns.length - 1;
    const lastRound = c.round >= c.rounds - 1;
    const half = lastTown && !c.halfDone && c.round + 1 === Math.ceil(c.rounds / 2) && !lastRound;
    const nextLine = lastTown ? (lastRound ? 'Everyone has played. Time for the final.' : half ? 'Halfway. Time for a price check.' : 'Next round.') : `${c.towns[c.turn + 1].name} is up next.`;
    setScreen('turnend', 'home', `<section class="sheet call" style="--t:var(--t${c.turn})">
      <h1 class="huge call-town">${esc(t.name)}</h1>
      <div class="payrow three"><div><span>Earned this turn</span><b>${fmt.usd(earned)}</b></div><div><span>Tasks right</span><b>${s.right} of ${TURN_TASKS}</b></div><div><span>Prices now</span><b>CPI ${t.cpi}</b></div></div>
    </section>`, { line: nextLine, main: 'Next', act: 'cup-next' });
    Sound.play('paper');
  }
  function cupNextTurn() {
    const c = S.cup;
    c.inTurn = 0;
    if (c.turn < c.towns.length - 1) { c.turn++; cupCall(); return; }
    c.turn = 0;
    const finishedRound = c.round;
    c.round++;
    if (c.round >= c.rounds) { cupFinalIntro(); return; }

  /* Payday: first everyone's dollars, then the same bars with prices taken out. The order can flip. */

  function pdReal() {

    const maxPay = Math.max.apply(null, list.map((t) => t.pay).concat([1]));

    const top = byReal[0];

  function matchTap(side, i, el) {
    const t = Run.t;
    if (Run.done || el.classList.contains('is-right')) return;
    if (!Run.sel || Run.sel.side === side) {
      $$('.mbtn.sel').forEach((b) => b.classList.remove('sel'));
      Run.sel = { side, i, el };
      Sound.play('tap');
      el.classList.add('sel');
      return;
    }
    const l = side === 'L' ? i : Run.sel.i, r = side === 'R' ? i : Run.sel.i, other = Run.sel.el;
    Run.sel = null;
    other.classList.remove('sel');
    if (t.answer[l] === r) {
      [el, other].forEach((b) => { b.classList.add('is-right'); const m = $('.mbadge', b); if (m) m.textContent = 'ABCD'[Run.matched]; });
      Run.matched++;
      if (Run.matched === t.left.length) answer('all');
      else Sound.play('check', { step: Run.matched - 1 });

      [el, other].forEach((b) => b.classList.add('is-wrong'));
