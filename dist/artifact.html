    /* ---------- AP STYLE: { d, lvl, q, a (right), w (four wrong), y } ---------- */
    AP: [
      { d: 'gdp', lvl: 2, q: 'A state pays for a new bridge this year. Where does it show up in U.S. GDP?', a: 'In G, government purchases', w: ['In C, consumption', 'In I, investment', 'In Xn, net exports', 'Nowhere, because it is a transfer'], y: 'A government buying a new good or service is G.' },
      { d: 'gdp', lvl: 2, q: 'In the circular flow model, which of the following flows from firms to households?', a: 'Goods and services', w: ['Factors of production', 'Consumption expenditures', 'Savings', 'Taxes'], y: 'Goods go to households, and factors go to firms. Money flows the other way.' },
      { d: 'gdp', lvl: 2, q: 'A firm buys a new machine made in the United States. How does this show up in the expenditures approach to U.S. GDP?', a: 'I rises, and GDP rises.', w: ['C rises, and GDP rises.', 'G rises, and GDP rises.', 'I rises, but GDP does not change.', 'Xn falls, and GDP falls.'], y: 'A firm buying new equipment is investment, and it was made here.' },
      { d: 'gdp', lvl: 3, q: 'A U.S. family buys a new $30,000 car made in Germany. What happens to U.S. GDP?', a: 'It does not change: C and imports both rise by $30,000.', w: ['It rises by $30,000, because C goes up and imports do not count.', 'It falls by $30,000, because imports rise and C does not count.', 'It rises by $30,000 through Xn.', 'It rises by $60,000.'], y: 'The spending is added in C and subtracted in imports.' },
      { d: 'gdp', lvl: 2, q: 'An orchard sells apples to a cider maker for $3. The cider maker sells cider to a grocery for $7. The grocery sells it to a shopper for $12. How much do these sales add to GDP?', a: '$12', w: ['$22', '$19', '$10', '$3'], y: 'Only the final sale counts. Value added: 3 + 4 + 5 = 12.' },
      { d: 'gdp', lvl: 2, q: 'Which of the following leaves the circular flow?', a: 'Savings', w: ['Investment', 'Exports', 'Government purchases', 'Consumption expenditures'], y: 'Taxes, savings, and imports leave. G, I, and exports come back.' },
      { d: 'gdp', lvl: 2, q: 'In a country, C is $700, I is $150, G is $200, exports are $90, and imports are $140, all in billions. What is GDP?', a: '$1,000 billion', w: ['$1,050 billion', '$1,100 billion', '$1,140 billion', '$1,280 billion'], y: '700 + 150 + 200 + (90 ' + M + ' 140) = 1,000.' },
      { d: 'gdp', lvl: 3, q: 'Which of the following counts as government purchases (G)?', a: "A city pays a firefighter's salary.", w: ['A veteran receives a benefit check.', 'The federal government pays a retiree Social Security.', 'A state pays a laid-off worker unemployment benefits.', 'A student receives a federal grant.'], y: 'Pay for work buys a service. The others are transfers.' },

      { d: 'miss', lvl: 2, q: 'Which of the following best shows a limitation of GDP as a measure of well-being?', a: 'A storm destroys homes, and the rebuilding raises GDP.', w: ['A firm builds a new factory to meet rising demand.', 'A family buys a new U.S.-made car for the drive to work.', 'The government buys new school buses.', 'Exports of U.S. wheat rise.'], y: 'GDP counts the rebuilding and never subtracts the loss.' },
      { d: 'miss', lvl: 2, q: 'A teacher tutors her own child at home instead of hiring a tutor. Compared with hiring one, what happens to GDP?', a: 'GDP is lower, because unpaid work at home is not counted.', w: ['GDP is higher, because she is working more.', 'GDP is the same, because the tutoring still happens at home.', 'GDP is higher, because her family saves money.', 'GDP is lower, because teachers earn less.'], y: 'Nonmarket work has no price, so GDP misses it.' },
      { d: 'miss', lvl: 2, q: 'Country A has a GDP of $800 billion and 40 million people. Country B has a GDP of $600 billion and 20 million people. Which is true?', a: 'B has the higher GDP per capita: $30,000 to $20,000.', w: ['A has the higher GDP per capita: $20,000 to $15,000.', 'A produces less in total.', 'B produces more in total.', 'They have the same GDP per capita.'], y: 'A: 800 billion ÷ 40 million. B: 600 billion ÷ 20 million.' },
      { d: 'miss', lvl: 2, q: 'Which of the following is left out of GDP because it is in the underground economy?', a: 'A roofer takes cash and does not report it.', w: ['A roofer bills a family and reports the sale.', 'A firm buys new roofing machines.', 'A city pays to fix a school roof.', 'A family pays a firm to replace its roof.'], y: 'Sales hidden from the government are not measured.' },
      { d: 'miss', lvl: 2, f: 'percapgrow', q: 'Real GDP rises 4 percent and population rises 1 percent. What happens to real GDP per capita?', a: 'It rises by about 3 percent.', w: ['It falls by about 3 percent.', 'It rises by about 5 percent.', 'It does not change.', 'It rises by about 4 percent.'], y: 'Output per person grows by about the difference.' },
      { d: 'miss', lvl: 2, q: 'Workers choose to take Fridays off. Output falls a little, and people say they are happier. This shows that GDP', a: 'does not count the value of leisure', w: ['overstates the value of leisure', 'counts leisure as part of consumption', 'rises when people work less', 'measures happiness directly'], y: 'Leisure counts as $0, so GDP falls even though people are better off.' },
      { d: 'miss', lvl: 2, q: 'Two countries have the same GDP per capita. In one, most families earn near the average. In the other, a few families earn almost everything. What does GDP per capita miss?', a: 'How income is divided', w: ['How much is produced', 'How many people live there', 'The price level', 'Whether goods are final'], y: 'An average hides how income is divided.' },
      { d: 'miss', lvl: 2, q: 'A factory pollutes a river while it makes chairs. How does GDP treat the damage to the river?', a: 'It is not subtracted, so GDP can overstate well-being.', w: ['It is subtracted from GDP.', 'It is subtracted from consumption, so GDP falls by the damage.', 'It raises GDP by the cost of the damage to the river.', 'It is counted as a transfer.'], y: 'The chairs count. The damage is never subtracted.' },

      { d: 'jobs', lvl: 2, q: 'An economy has 1,900 people employed, 100 unemployed, and 1,000 adults not in the labor force. What is the unemployment rate?', a: '5.0%', w: ['3.3%', '5.3%', '63.3%', '66.7%'], y: '100 ÷ 2,000 × 100. Divide by the labor force.' },
      { d: 'jobs', lvl: 2, q: 'A town has 1,500 adults. 900 have jobs and 100 are looking. What is the labor force participation rate?', a: '66.7%', w: ['10.0%', '33.3%', '60.0%', '90.0%'], y: '1,000 ÷ 1,500 × 100. Labor force over all adults.' },
      { d: 'jobs', lvl: 2, q: 'An unemployed worker stops looking for a job because he thinks none exist. What happens to the unemployment rate and the LFPR?', a: 'Both fall.', w: ['Both rise.', 'The rate falls, and the LFPR does not change.', 'The rate rises, and the LFPR falls.', 'Neither changes.'], y: 'He leaves the labor force. Nobody found a job.' },
      { d: 'jobs', lvl: 2, q: 'A retiree who was not looking for work starts applying for jobs. What happens to the unemployment rate and the LFPR?', a: 'Both rise.', w: ['Both fall.', 'The rate rises, and the LFPR falls.', 'The rate falls, and the LFPR rises.', 'Neither changes.'], y: 'He joins the labor force as unemployed.' },
      { d: 'jobs', lvl: 2, q: 'Which of these workers is structurally unemployed?', a: 'A teller looking for work after her bank closed its branches for good', w: ['A teller who quit to find a job closer to home and is applying at other banks', 'A teller laid off in a recession who is looking for work', 'A teller who stopped looking months ago', 'A teller on 10 hours a week who wants more'], y: 'Those jobs are gone for good, and her skills must change. She is looking, so she counts as unemployed.' },
      { d: 'jobs', lvl: 2, q: 'Frictional unemployment is 2 percent, structural is 2.5 percent, and the actual rate is 6 percent. What is cyclical unemployment?', a: '1.5%', w: ['3.5%', '4.5%', '6.0%', '10.5%'], y: 'Natural = 2 + 2.5 = 4.5. Cyclical = 6 ' + M + ' 4.5.' },
      { d: 'jobs', lvl: 2, q: 'An economy is at full employment. Which of the following is true?', a: 'Cyclical unemployment is zero.', w: ['The unemployment rate is zero.', 'Frictional unemployment is zero.', 'Structural unemployment is zero.', 'The LFPR is 100 percent.'], y: 'Frictional and structural unemployment remain at full employment.' },
      { d: 'jobs', lvl: 3, q: 'Which of the following would most likely lower the natural rate of unemployment?', a: 'A program that trains workers for the jobs that are open', w: ['The end of a recession that had raised the unemployment rate', 'A rise in the actual unemployment rate this year', 'A fall in real GDP', 'A rise in cyclical unemployment'], y: 'Better matching lowers structural unemployment. The others are about the cycle.' },
      { d: 'jobs', lvl: 2, q: 'A worker stops looking for a job because he thinks none exist. How does the official rate treat him?', a: 'He is left out of the labor force.', w: ['He is counted as unemployed because he wants work.', 'He is counted as employed until he retires.', 'He stays in the labor force as a job seeker.', 'He is counted as cyclically unemployed.'], y: 'He wants work but is not looking, so the official rate does not count him.' },

      { d: 'prices', lvl: 2, q: 'The CPI was 125 last year and 130 this year. What was the inflation rate?', a: '4.0%', w: ['3.8%', '5.0%', '30.0%', '104.0%'], y: '(130 ' + M + ' 125) ÷ 125 × 100. Divide by the old CPI.' },
      { d: 'prices', lvl: 2, q: 'A basket costs $40 in the base year and $46 today. What is the price index today?', a: '115', w: ['15', '46', '87.0', '106'], y: '46 ÷ 40 × 100.' },
      { d: 'prices', lvl: 2, q: 'Which of the following describes disinflation?', a: 'The inflation rate falls from 6% to 2%.', w: ['The price level falls 2%.', 'The inflation rate rises from 2% to 6%.', 'Real GDP falls 2%.', 'The CPI falls from 120 to 118.'], y: 'Prices still rise, just more slowly.' },
      { d: 'prices', lvl: 2, q: 'Beef doubles in price, and shoppers switch to chicken, but the CPI basket still counts the same beef. What is the most likely result?', a: 'The CPI overstates the rise in the cost of living.', w: ['The CPI understates the rise in the cost of living.', 'Beef leaves the basket at once.', 'The base year changes.', 'Real wages rise along with the CPI.'], y: 'Substitution bias. People switched, and the basket did not.' },
      { d: 'prices', lvl: 3, f: 'realwage', q: 'Your wage rises from $30 to $33 an hour while the CPI rises from 100 to 120. What happens to your real wage?', a: 'It falls, from $30.00 to $27.50.', w: ['It rises, from $30.00 to $33.00.', 'It rises, from $25.00 to $27.50.', 'It stays at $30.00.', 'It falls, from $33.00 to $30.00.'], y: '33 ÷ 120 × 100 = 27.50.' },
      { d: 'prices', lvl: 2, f: 'convert', q: 'A ticket cost $5 when the CPI was 100. The CPI is now 300. What is that price in today\'s dollars?', a: '$15.00', w: ['$1.67', '$5.00', '$10.00', '$305.00'], y: '5 × (300 ÷ 100).' },
      { d: 'prices', lvl: 2, f: 'cpi', q: 'What does the CPI measure?', a: 'The cost of a fixed basket compared with the base year', w: ['The value of all goods produced in a country', 'The prices of all goods and services produced in a country', 'The growth rate of real GDP', 'The prices of new goods only'], y: 'A fixed basket of goods and services, relative to the base year.' },
      { d: 'prices', lvl: 3, q: 'With a base-year index of 100, a country\'s CPI is 90 today. Which of the following is true?', a: 'The price level is 10 percent below the base year.', w: ['Inflation was 90 percent this year.', 'Real GDP fell 10 percent.', 'The price level is 90 percent above the base year.', 'Inflation was 10 percent this year.'], y: 'The index compares with the base year, not with last year.' },

      { d: 'costs', lvl: 2, q: 'A bank lends at a fixed 8 percent, expecting 3 percent inflation. Inflation turns out to be 6 percent. What real interest rate does the bank earn?', a: '2%', w: ['3%', '5%', '11%', '14%'], y: '8 ' + M + ' 6 = 2. The bank expected 5.' },
      { d: 'costs', lvl: 1, q: 'Inflation is higher than everyone expected. Who is most likely helped?', a: 'A family paying a fixed-rate mortgage', w: ['A bank holding fixed-rate mortgages', 'A retiree on a fixed pension', 'A saver keeping cash at home', 'A worker on a fixed salary for three more years'], y: 'A fixed-rate borrower repays in dollars that buy less.' },
      { d: 'costs', lvl: 2, q: 'Inflation is higher than everyone expected. Who is most likely protected?', a: 'A worker whose pay is tied to the CPI', w: ['A bank holding fixed-rate loans', 'A landlord locked into a fixed-rent lease', 'A saver holding cash', 'A retiree on a fixed pension'], y: 'Indexed pay rises with prices.' },
      { d: 'costs', lvl: 3, q: 'Prices fall when nobody expected it. Who is most likely hurt?', a: 'A firm repaying a fixed-rate bank loan', w: ['A bank holding fixed-rate loans', 'A retiree on a fixed pension', 'A saver holding cash', 'An investor holding fixed-rate government bonds'], y: 'Surprise deflation hurts borrowers. The others gain.' },
      { d: 'costs', lvl: 2, q: 'A bank and a borrower both expect 4 percent inflation and agree on a 7 percent rate. Inflation turns out to be 4 percent. Who gains?', a: 'Neither: the real rate is 3 percent.', w: ['The bank: the real rate is 7 percent.', 'The borrower: the real rate is 3 percent.', 'The bank: the real rate is 11 percent.', 'The borrower: the real rate is ' + M + '3 percent.'], y: 'Expected inflation is built in, so it moves little wealth.' },
      { d: 'costs', lvl: 2, q: 'A hardware store pays staff to change every shelf tag each time prices rise. This is', a: 'a menu cost', w: ['a shoe-leather cost', 'substitution bias', 'redistribution of wealth', 'new-goods bias'], y: 'Changing posted prices costs money.' },
      { d: 'costs', lvl: 2, q: 'A firm sends an employee to the bank every weekday so cash does not sit in the register during high inflation. This is', a: 'a shoe-leather cost', w: ['a menu cost of inflation', 'new-goods bias', 'substitution bias', 'a real wage cut'], y: 'Effort spent to hold less cash.' },
      { d: 'costs', lvl: 2, f: 'realrate', q: 'Inflation is 5 percent, and a savings account pays 3 percent. What happens to the buying power of the savings?', a: 'It falls by about 2 percent a year.', w: ['It rises by about 3 percent a year.', 'It rises by about 8 percent a year.', 'It does not change.', 'It falls by about 5 percent a year.'], y: 'Real rate = 3 ' + M + ' 5 = ' + M + '2.' },

      { d: 'real', lvl: 2, f: 'realgdp', q: 'Nominal GDP is $1,320 billion, and the GDP deflator is 110. What is real GDP?', a: '$1,200 billion', w: ['$1,210 billion', '$1,320 billion', '$1,430 billion', '$1,452 billion'], y: '1,320 ÷ 110 × 100.' },
      { d: 'real', lvl: 2, q: 'Nominal GDP rose 3 percent while prices rose 5 percent. What happened to real GDP?', a: 'It fell by about 2 percent.', w: ['It rose by about 8 percent.', 'It rose by about 2 percent.', 'It rose by about 3 percent.', 'It did not change.'], y: 'Real growth is about nominal growth minus inflation.' },
      { d: 'real', lvl: 2, q: 'An economy makes only pizzas. In the base year it makes 100 pizzas at $10. This year it makes 110 pizzas at $12. What is real GDP this year?', a: '$1,100', w: ['$1,000', '$1,200', '$1,210', '$1,320'], y: "This year's pizzas at the base-year price: 110 × 10." },
      { d: 'real', lvl: 2, q: 'An economy has a nominal GDP of $900 billion and a real GDP of $750 billion. What is the GDP deflator?', a: '120', w: ['1.2', '20', '83.3', '150'], y: '900 ÷ 750 × 100.' },
      { d: 'real', lvl: 1, f: 'baseyear', q: 'In the base year, which of the following is always true?', a: 'Nominal GDP equals real GDP.', w: ['Inflation is zero.', 'Real GDP is at potential.', 'Unemployment is at the natural rate.', 'Nominal GDP is above real GDP.'], y: 'Base-year prices are current prices that year.' },
      { d: 'real', lvl: 2, q: 'Prices have risen every year since the base year. Which of the following is true this year?', a: 'Nominal GDP is above real GDP.', w: ['Real GDP is above nominal GDP.', 'Nominal GDP and real GDP are equal.', 'The deflator is below 100.', 'Real GDP must be falling.'], y: 'Nominal uses the higher current prices.' },
      { d: 'real', lvl: 1, q: 'Why do economists use real GDP to compare output across years?', a: 'It removes changes in the price level.', w: ['It includes the prices of imports.', 'It counts only goods and leaves out services.', 'It is measured at current prices.', 'It adds transfer payments.'], y: 'Only output moves real GDP.' },
      { d: 'real', lvl: 3, f: 'growth', q: 'Year 1 is the base year, and nominal GDP is $500 billion. In Year 2, nominal GDP is $660 billion and the deflator is 120. By what percent did real GDP grow?', a: '10.0%', w: ['9.1%', '12.0%', '20.0%', '32.0%'], y: '660 ÷ 120 × 100 = 550. Then (550 ' + M + ' 500) ÷ 500 × 100.' },

      { d: 'cycle', lvl: 2, q: 'Real GDP is rising but is still below potential. Which of the following is true?', a: 'The economy is in an expansion with a negative gap.', w: ['The economy is in a contraction with a negative gap.', 'The economy is in an expansion with a positive gap.', 'The economy is at a peak.', 'The economy is at a trough with a positive gap.'], y: 'Rising is an expansion. Below potential is a negative gap.' },
      { d: 'cycle', lvl: 1, q: 'Real GDP has just stopped rising and will fall next. Where is the economy?', a: 'At a peak', w: ['At a trough', 'In a contraction', 'In an expansion', 'At potential output'], y: 'The peak is the top turning point.' },
      { d: 'cycle', lvl: 2, f: 'gapdollar', q: 'Actual real GDP is $1,140 billion, and potential real GDP is $1,200 billion. What is the output gap?', a: 'A negative gap of $60 billion', w: ['A positive gap of $60 billion', 'A negative gap of $1,140 billion', 'No gap, since GDP is positive', 'A positive gap of $2,340 billion'], y: '1,140 ' + M + ' 1,200 = ' + M + '60.' },
      { d: 'cycle', lvl: 2, q: 'Cyclical unemployment is 1.5 percent. Which of the following must be true?', a: 'Real GDP is below potential.', w: ['Real GDP is above potential.', 'Real GDP is at potential.', 'The natural rate is 1.5 percent.', 'The actual rate is 1.5 percent.'], y: 'Positive cyclical unemployment means the actual rate is above the natural rate: a negative gap.' },
      { d: 'cycle', lvl: 1, q: 'Who decides the official dates of U.S. recessions?', a: 'The NBER', w: ['The BLS', 'The BEA', 'Congress', 'The Federal Reserve'], y: 'The National Bureau of Economic Research.' },
      { d: 'cycle', lvl: 2, q: 'Why is "two quarters of falling real GDP" not the official definition of a recession?', a: 'The NBER looks at depth, breadth, and length across many measures.', w: ['GDP is not measured in every quarter of the year.', 'Recessions in the United States have always lasted only one quarter.', 'Only unemployment is used.', 'Congress votes on each recession.'], y: 'Two quarters is only a rule of thumb.' },
      { d: 'cycle', lvl: 2, q: 'An economy has a positive output gap. Which of the following is most likely?', a: 'Unemployment is below the natural rate, and prices tend to rise.', w: ['Unemployment is above the natural rate, and prices tend to rise.', 'Output is below potential, and prices tend to fall.', 'Cyclical unemployment is positive.', 'Prices tend to fall.'], y: 'Output is above potential, so the economy is running hot.' },
      { d: 'cycle', lvl: 2, f: 'potential', q: 'What happens to potential real GDP in a typical contraction?', a: 'It keeps growing with workers, capital, and technology.', w: ['It falls along with actual real GDP and spending.', 'It drops to zero.', 'It always equals actual real GDP, even in a contraction.', 'It rises only at a peak.'], y: 'Actual real GDP falls. The potential line keeps climbing.' },
      { d: 'cycle', lvl: 1, q: 'On a business cycle graph, real GDP is on the vertical axis. What is on the horizontal axis?', a: 'Time', w: ['The price level', 'Unemployment', 'Inflation', 'Quantity'], y: 'Real GDP over time.' },

      { d: 'micro', lvl: 2, q: 'The equilibrium price of rice is $4. The government sets a price ceiling of $3. Which of the following is most likely?', a: 'A shortage develops.', w: ['A surplus develops.', 'Nothing changes.', 'The demand for rice increases.', 'Sellers make more rice.'], y: 'A ceiling below equilibrium binds.' },
      { d: 'micro', lvl: 2, q: 'The equilibrium wage in a market is $12. The government sets a minimum wage of $10. What happens?', a: 'Nothing changes, because the floor does not bind.', w: ['A surplus of labor develops, because the floor binds.', 'A shortage of labor develops as firms hire more.', 'The wage falls to $10.', 'The demand for labor falls.'], y: 'A floor below equilibrium does not bind.' },
      { d: 'micro', lvl: 2, q: 'The United States adds a tariff on imported shoes. Which of the following is most likely for U.S. shoe makers?', a: 'They sell more at a higher price.', w: ['They sell less at a higher price.', 'They sell more at a lower price.', 'They sell less at a lower price.', 'Nothing changes for them.'], y: 'A higher price helps U.S. makers and costs U.S. buyers.' },
      { d: 'micro', lvl: 3, q: 'A 25 percent rise in price cuts the quantity demanded by 5 percent. Demand is', a: 'inelastic, and total revenue rises', w: ['elastic, and total revenue falls', 'elastic, and total revenue rises', 'inelastic, and total revenue falls', 'unit elastic, and total revenue does not change'], y: 'Quantity moved less than price, so revenue rises.' },
      { d: 'micro', lvl: 2, q: 'A buyer would pay up to $40 for a ticket, and the seller would take as little as $15. They trade at $25. What is the total surplus from this sale?', a: '$25', w: ['$10', '$15', '$40', '$65'], y: 'Consumer surplus $15 + producer surplus $10.' },
    ],

    /* ---------- AP STYLE, second batch (Nov 17, 2026): same fields. The teacher asked for more AP style questions and
       more variety. All written fresh for this game. Never copy a question from the real test or from AP Classroom. ---------- */
    AP2: [
      { d: 'gdp', lvl: 1, q: 'Which of the following is counted in U.S. GDP this year?', a: 'A haircut at a barbershop', w: ['The sale of a ten-year-old house', 'A share of stock bought on an exchange', 'Tires sold to a carmaker for new cars', 'A Social Security check'], y: 'A haircut is a new final service. The others are used, financial, intermediate, or a transfer.' },
      { d: 'gdp', lvl: 2, q: 'A carmaker builds 100 cars this year and sells 90 of them. How does GDP treat the 10 unsold cars this year?', a: 'They count as investment, in inventories.', w: ['They count as consumption this year.', 'They are not counted until they are sold.', 'They count as government purchases.', 'They are subtracted, the way imports are.'], y: 'Goods made but not yet sold are added to inventories, and inventories are part of I.' },
      { d: 'gdp', lvl: 2, q: 'A Japanese carmaker builds cars at a plant it owns in Ohio. How does U.S. GDP treat those cars?', a: 'They count, because they were made here.', w: ['They do not count, because the firm is foreign.', "They count only in Japan's GDP.", 'They count only if the cars are exported.', 'Only the wages of the U.S. workers count.'], y: 'GDP counts production inside the borders, no matter who owns the firm.' },
      { d: 'gdp', lvl: 2, q: 'Which of the following is an example of investment (I) in GDP?', a: 'A family buys a newly built house.', w: ['A family buys shares in a mutual fund.', 'A family puts $5,000 in a savings account.', 'A firm buys a used delivery truck from another firm.', 'A city builds a new library.'], y: 'New homes count as investment. Stocks and savings are financial, the truck is used, and the library is G.' },
      { d: 'gdp', lvl: 1, q: 'Under the income approach, GDP is the sum of', a: 'wages, rent, interest, and profit', w: ['consumption, investment, government purchases, and net exports', 'the value added at every stage of production', 'taxes, savings, and imports', 'exports minus imports'], y: 'The income approach adds up what the factors of production earn.' },
      { d: 'gdp', lvl: 2, q: 'A baker buys $2 of flour and sells a loaf to a store for $5. The store sells the loaf to a shopper for $8. What is the value added by the store?', a: '$3', w: ['$2', '$5', '$8', '$15'], y: '$8 ' + M + ' $5 = $3.' },
      { d: 'gdp', lvl: 1, q: 'In the circular flow, which of the following is exchanged in the factor market?', a: 'Labor', w: ['Groceries', 'Haircuts', 'New cars', 'Movie tickets'], y: 'Households sell labor, land, and capital to firms in the factor market.' },
      { d: 'gdp', lvl: 2, q: 'Exports are $300 billion and imports are $380 billion. What do net exports add to GDP?', a: M + '$80 billion', w: ['$80 billion', '$300 billion', '$680 billion', M + '$380 billion'], y: 'Xn = 300 ' + M + ' 380 = ' + M + '80.' },
      { d: 'gdp', lvl: 2, q: 'The government mails $1,000 to every retiree. By itself, how does this change G in GDP?', a: 'G does not change. It is a transfer.', w: ['G rises by $1,000 for each retiree.', 'G falls, because the money leaves the government.', 'G rises, and C falls by the same amount.', 'G rises only if the retirees spend the money.'], y: 'Nothing was bought or made. G counts only purchases of goods and services.' },
      { d: 'gdp', lvl: 2, q: 'Which of the following would be counted in the GDP of the United States?', a: 'A German firm makes cars in Alabama.', w: ['A U.S. firm makes phones in Vietnam.', 'A U.S. citizen works for a bank in London.', 'A U.S. family buys a used boat.', 'A U.S. investor buys stock in a Texas firm.'], y: 'GDP counts what is made inside the borders.' },
      { d: 'gdp', lvl: 1, q: 'In the circular flow, households receive income from firms in exchange for', a: 'factors of production', w: ['final goods and services', 'tax payments', 'transfer payments', 'net exports of goods'], y: 'Households sell labor, land, and capital. Firms pay wages, rent, interest, and profit.' },
      { d: 'gdp', lvl: 2, q: 'A farmer sells wheat to a mill for $1. The mill sells flour to a bakery for $3. The bakery sells bread to families for $7. What is the total value added at all three stages?', a: '$7', w: ['$3', '$4', '$10', '$11'], y: '1 + 2 + 4 = 7, the same as the final sale.' },
      { d: 'gdp', lvl: 2, q: 'Which transaction is left out of GDP because it is purely financial?', a: 'A saver buys a government bond.', w: ['A bank pays a teller for a week of work.', 'A broker charges a fee to sell stock.', 'A firm builds a new warehouse.', 'A family pays a plumber.'], y: 'Buying a bond moves money. Nothing new is made. The broker fee is a service, so it counts.' },
      { d: 'gdp', lvl: 1, q: 'Which of the following brings money back into the circular flow?', a: 'Exports', w: ['Imports', 'Taxes', 'Savings', 'Cash kept at home'], y: 'Investment, government purchases, and exports come back in. Savings, taxes, and imports leave.' },
      { d: 'gdp', lvl: 1, q: 'GDP is best defined as the market value of all', a: 'final goods and services produced in a country in a year', w: ['goods and services sold in a country in a year', "final goods and services produced by a country's citizens anywhere", 'intermediate and final goods produced in a country', 'goods owned by households, firms, and the government'], y: 'Final, to avoid double counting. Produced inside the borders. In one year.' },
      { d: 'gdp', lvl: 2, q: 'A restaurant buys $500 of vegetables and sells $2,000 of meals made with them. How much does this add to GDP?', a: '$2,000', w: ['$500', '$1,500', '$2,500', '$3,000'], y: 'Only the final meals count. The vegetables are intermediate goods.' },
      { d: 'gdp', lvl: 3, q: 'Consumption is $600, investment is $120, government purchases are $180, and GDP is $880, all in billions. What are net exports?', a: M + '$20 billion', w: ['$20 billion', '$80 billion', M + '$80 billion', '$0'], y: '880 ' + M + ' (600 + 120 + 180) = ' + M + '20.' },
      { d: 'gdp', lvl: 2, q: 'Which of the following is true in the circular flow model?', a: 'Household spending becomes revenue for firms.', w: ['Money and goods flow in the same direction.', 'Households buy factors of production from firms.', 'Firms sell their goods in the factor market.', 'Savings go straight to firms as consumption.'], y: 'Spending on goods flows to firms, and firms pay it back out as income.' },
      { d: 'gdp', lvl: 2, q: 'A city pays a contractor to repave a road. The same city mails a pension check to a retiree. How do these enter GDP?', a: 'The paving is G. The pension is not counted.', w: ['Both count as government purchases, because a city pays both.', 'The pension is G, and the paving is investment.', 'Neither counts, because cities do not sell goods.', 'The paving is investment, and the pension is consumption.'], y: 'The paving buys a service. The pension is a transfer.' },
      { d: 'gdp', lvl: 2, q: 'Which pair lists only intermediate goods?', a: 'Steel sold to a carmaker and flour sold to a bakery', w: ['A new car sold to a family and bread sold to a family', 'Steel sold to a carmaker and a new car sold to a family', 'A haircut and a movie ticket', 'A new factory and a new delivery truck'], y: 'Intermediate goods are used up making something else. A factory and a truck are investment.' },

      { d: 'miss', lvl: 2, q: 'Real GDP per person rises in a town, but families now lose two more hours a day sitting in traffic. GDP per person most likely', a: 'overstates the gain in well-being', w: ['understates the gain in well-being', 'measures the gain in well-being exactly', 'falls, because traffic is a nonmarket activity', 'leaves out the goods the town produced'], y: 'Lost free time is a real cost, and GDP never subtracts it.' },
      { d: 'miss', lvl: 2, q: 'A parent leaves a paid job to care for a child at home, and the family stops paying a daycare center. What happens to GDP?', a: 'It falls, though the child still gets care.', w: ['It rises, because the parent now works at home.', 'It stays the same, because the care still happens.', 'It rises, because the family saves money.', 'It falls only if the parent was paid in cash.'], y: 'Paid care counts. The same care at home is nonmarket, so it does not.' },
      { d: 'miss', lvl: 2, q: "A new phone costs the same as last year's model but takes better photos and runs faster. GDP most likely", a: 'understates the gain in quality', w: ['overstates the gain, because the price did not change', 'counts the full gain as a rise in consumption', 'falls, because the old phone is now a used good', 'rises by the value of the better photos'], y: 'The price is the same, so GDP is the same, even though buyers get more.' },
      { d: 'miss', lvl: 2, q: 'Which of the following would make measured GDP smaller than the amount actually produced?', a: 'More sales paid in cash and never reported', w: ['More firms reporting every one of their sales', 'More families hiring cleaning services', 'More spending on newly built homes', 'More government purchases of trucks'], y: 'Unreported sales are the underground economy. They are produced but not measured.' },
      { d: 'miss', lvl: 2, q: 'Countries A and B have the same real GDP per capita. Workers in A work 30 hours a week. Workers in B work 50. What does GDP per capita leave out?', a: 'The value of leisure', w: ['The value of exports', 'The price level', 'The size of the labor force', 'Government purchases'], y: 'People in A get the same output with more free time. GDP counts leisure as $0.' },
      { d: 'miss', lvl: 1, q: 'Real GDP per capita is most often used to compare', a: 'average standards of living across countries', w: ['the total size of two economies', 'how evenly income is divided inside a country', 'how clean the environment is in a country', 'the price levels of two countries'], y: 'Output per person is the usual measure of the average standard of living.' },
      { d: 'miss', lvl: 2, f: 'percapgrow', q: 'Real GDP grows 2 percent while the population grows 3 percent. Which of the following is true?', a: 'Real GDP per capita falls by about 1 percent.', w: ['Real GDP per capita rises by about 1 percent.', 'Real GDP per capita rises by about 5 percent.', 'Real GDP per capita does not change.', 'Total output falls by about 1 percent.'], y: 'More people are sharing output that grew more slowly: 2 ' + M + ' 3 = ' + M + '1.' },
      { d: 'miss', lvl: 2, q: 'A logging firm clears a forest and sells the wood. How does GDP treat this?', a: 'The wood counts. The lost forest is not subtracted.', w: ['The wood counts, and the lost forest is subtracted.', 'Neither counts, because nature is not a market good.', 'Only the lost forest counts, as a cost.', 'The wood counts as a transfer payment.'], y: 'GDP adds the sale and never subtracts the harm to the environment.' },
      { d: 'miss', lvl: 1, q: 'Which of the following is a nonmarket activity that GDP leaves out?', a: 'Painting your own house', w: ['Paying a painter to paint your house', 'Buying paint at a hardware store', 'A painter buying a new ladder', 'A city paying to paint a school'], y: 'No one is paid, so there is no market sale to count.' },
      { d: 'miss', lvl: 2, q: 'GDP per capita rises 10 percent, but nearly all of the gain goes to the richest families. This shows that GDP per capita', a: 'says nothing about how income is divided', w: ['always falls when income is divided unevenly', 'overstates how much the country produced', 'leaves the richest families out of the count', 'measures the income of the typical family'], y: 'It is an average. An average can rise while most families gain little.' },
      { d: 'miss', lvl: 1, q: 'A country has a GDP of $900 billion and 30 million people. What is GDP per capita?', a: '$30,000', w: ['$3,000', '$27,000', '$270,000', '$300,000'], y: '900 billion ' + '÷' + ' 30 million = 30,000.' },
      { d: 'miss', lvl: 2, q: 'Which change would raise economic well-being but leave GDP unchanged?', a: 'More vacation time with the same output', w: ['Firms selling more goods at the same prices', 'The government buying more school buses', 'Families buying more new cars', 'Exports rising while imports stay the same'], y: 'Leisure has value, but GDP counts it as $0.' },
      { d: 'miss', lvl: 2, q: 'Why might GDP per capita overstate living standards in a country with heavy pollution?', a: 'GDP does not subtract harm to the environment.', w: ['GDP subtracts too much for pollution.', 'Pollution lowers the number of people.', 'Cleanup spending is left out of GDP.', 'Polluting firms are all in the underground economy.'], y: 'The goods are counted. The dirty air and water are not subtracted.' },
      { d: 'miss', lvl: 2, q: 'A babysitter is paid in cash and reports none of it. A daycare center reports every dollar. Which is true of GDP?', a: 'It counts the daycare, not the babysitter.', w: ['It counts both, because both are paid.', 'It misses both, because both are child care.', 'It counts the babysitter and misses the daycare.', 'It counts both as government purchases.'], y: 'Unreported cash work is in the underground economy.' },
      { d: 'miss', lvl: 2, q: 'Which of the following is NOT a reason GDP is an imperfect measure of well-being?', a: 'It counts goods bought by the government.', w: ['It leaves out unpaid work done at home.', 'It leaves out the value of leisure.', 'It does not subtract harm from pollution.', 'It does not show how income is divided.'], y: 'Counting G is correct. The other four are real limitations.' },

      { d: 'jobs', lvl: 1, q: 'A full-time worker has her hours cut to 15 a week. She wants full-time work. How does the official survey count her?', a: 'Employed', w: ['Unemployed', 'Not in the labor force', 'A discouraged worker', 'Frictionally unemployed'], y: 'Anyone who worked for pay, even part time, is employed.' },
      { d: 'jobs', lvl: 1, q: 'Which person is counted as unemployed?', a: 'A laid-off welder who applied for two jobs this week', w: ['A retiree who volunteers at a library', 'A full-time student who is not looking for work', 'A parent who stays home with children and is not looking', 'A cashier working ten hours a week'], y: 'Unemployed means no job, available, and looking.' },
      { d: 'jobs', lvl: 1, q: 'A coal miner loses his job when the mine closes for good. No employer nearby needs his skills. He is', a: 'structurally unemployed', w: ['frictionally unemployed', 'cyclically unemployed', 'not in the labor force', 'employed part time'], y: 'His skills no longer match the jobs that exist. Structural.' },
      { d: 'jobs', lvl: 1, q: 'A nurse quits her job in Boston and spends three weeks looking for a nursing job in Miami. She is', a: 'frictionally unemployed', w: ['structurally unemployed', 'cyclically unemployed', 'not in the labor force', 'a discouraged worker'], y: 'Jobs for her skills exist. She is between jobs while she searches.' },
      { d: 'jobs', lvl: 1, q: 'In a recession, a furniture factory lays off workers because sales are down across the whole economy. These workers are', a: 'cyclically unemployed', w: ['frictionally unemployed', 'structurally unemployed', 'not in the labor force', 'discouraged workers'], y: 'The layoffs come from the downturn in the business cycle.' },
      { d: 'jobs', lvl: 1, q: 'The natural rate of unemployment is the sum of', a: 'frictional and structural unemployment', w: ['frictional and cyclical unemployment', 'structural and cyclical unemployment', 'frictional, structural, and cyclical unemployment', 'cyclical unemployment and discouraged workers'], y: 'At the natural rate, cyclical unemployment is zero.' },
      { d: 'jobs', lvl: 2, q: 'The unemployment rate is 7 percent and the natural rate is 5 percent. Which of the following is true?', a: 'Cyclical unemployment is 2 percent.', w: ['Cyclical unemployment is zero.', 'Frictional unemployment is 2 percent.', 'The economy is above full employment.', 'Structural unemployment is 7 percent.'], y: 'Cyclical = actual ' + M + ' natural = 7 ' + M + ' 5.' },
      { d: 'jobs', lvl: 2, q: 'Many unemployed workers give up looking for jobs. What happens to the official unemployment rate?', a: 'It falls, even though no one found a job.', w: ['It rises, because more people are jobless.', 'It does not change, because they still have no jobs.', 'It rises, because the labor force shrinks.', 'It falls, because employment rises.'], y: 'They leave the labor force, so they are no longer counted as unemployed.' },
      { d: 'jobs', lvl: 2, q: 'Why can the official unemployment rate understate how weak the job market is?', a: 'It leaves out discouraged workers.', w: ['It counts retirees as unemployed.', 'It counts full-time students as unemployed.', 'It leaves out people who hold two jobs.', 'It counts part-time workers as unemployed.'], y: 'People who gave up looking are not counted as unemployed.' },
      { d: 'jobs', lvl: 2, q: 'An unemployed worker is hired. What happens to the unemployment rate and to the size of the labor force?', a: 'The rate falls. The labor force stays the same.', w: ['The rate falls, and the labor force grows.', 'The rate falls, and the labor force shrinks.', 'The rate stays the same, and the labor force grows.', 'Both the rate and the labor force rise.'], y: 'She moves from unemployed to employed. Both are inside the labor force.' },
      { d: 'jobs', lvl: 3, q: 'An employed worker retires and does not look for work. What happens to the unemployment rate?', a: 'It rises, because the labor force is smaller.', w: ['It falls, because one fewer person is working.', 'It does not change, because he was never unemployed.', 'It falls, because the labor force is smaller.', 'It rises, because he is now counted as unemployed.'], y: 'The same number of unemployed is divided by a smaller labor force.' },
      { d: 'jobs', lvl: 2, q: 'Which of the following is most likely to raise structural unemployment?', a: 'Self-checkout machines replace cashiers.', w: ['Workers take longer to choose among job offers.', 'A recession cuts spending across the economy.', 'More graduates enter the job market in June.', 'A job website speeds up the search for work.'], y: 'The skill is no longer needed. That is structural.' },
      { d: 'jobs', lvl: 1, q: 'Which of the following people is in the labor force?', a: 'A laid-off waiter who is applying for jobs', w: ['A retired teacher who is not looking for work', 'A stay-at-home parent who is not looking for work', 'A full-time student who is not looking for work', 'A worker who gave up looking for a job a year ago'], y: 'The labor force is the employed plus the unemployed who are looking.' },
      { d: 'jobs', lvl: 3, q: 'A town has 400 employed, 100 unemployed, and 500 adults not in the labor force. If 50 of the unemployed stop looking, the unemployment rate goes from', a: '20% to 11.1%', w: ['20% to 10%', '10% to 5%', '20% to 25%', '25% to 12.5%'], y: 'Before: 100 ' + '÷' + ' 500. After: 50 ' + '÷' + ' 450.' },
      { d: 'jobs', lvl: 2, q: 'Which of the following would lower frictional unemployment?', a: 'A website that matches workers with openings faster', w: ['A training program for workers whose skills are out of date', 'A rise in spending that ends a recession', 'A law that raises the minimum wage', 'Robots that replace factory workers'], y: 'Frictional unemployment is search time. A faster match shortens it.' },
      { d: 'jobs', lvl: 1, q: 'Who is a discouraged worker?', a: 'Someone who wants a job but has stopped looking', w: ['Someone who works part time but wants full time', 'Someone who was laid off and is applying for jobs', 'Someone who quit to look for a better job', 'Someone who retired last year and likes it'], y: 'Not looking means not in the labor force, so not counted as unemployed.' },
      { d: 'jobs', lvl: 3, q: 'Cyclical unemployment is negative. Which of the following is true?', a: 'The unemployment rate is below the natural rate.', w: ['The economy is in a recession with a negative output gap.', 'Real GDP is below potential real GDP.', 'Frictional unemployment is zero.', 'The labor force is shrinking.'], y: 'Cyclical = actual ' + M + ' natural. Negative means actual is lower.' },
      { d: 'jobs', lvl: 2, q: 'The labor force is 2,000 and 150 people are unemployed. How many people are employed?', a: '1,850', w: ['150', '2,000', '2,150', '1,700'], y: 'Labor force = employed + unemployed, so 2,000 ' + M + ' 150.' },

      { d: 'prices', lvl: 2, q: 'The CPI rises from 200 to 210 in one year and from 210 to 216.3 in the next. Which of the following is true of the second year?', a: 'There was disinflation.', w: ['There was deflation.', 'Inflation sped up.', 'The price level fell.', 'The price level did not change.'], y: 'Inflation fell from 5 percent to 3 percent. Prices still rose.' },
      { d: 'prices', lvl: 1, q: 'The inflation rate is ' + M + '2 percent this year. Which of the following is true?', a: 'The price level is falling.', w: ['The price level is rising more slowly.', 'This is disinflation.', 'Real wages must be falling.', 'The CPI is below zero.'], y: 'A negative inflation rate is deflation.' },
      { d: 'prices', lvl: 1, q: 'A basket of goods cost $200 in the base year. It costs $250 this year. What is the CPI this year?', a: '125', w: ['50', '80', '150', '250'], y: '250 ' + '÷' + ' 200 ' + '×' + ' 100 = 125.' },
      { d: 'prices', lvl: 2, f: 'wagechange', q: 'A worker gets a 3 percent raise in a year when inflation is 5 percent. Her real wage', a: 'falls by about 2 percent', w: ['rises by about 2 percent', 'rises by about 8 percent', 'falls by about 8 percent', 'does not change at all'], y: '3 ' + M + ' 5 = ' + M + '2.' },
      { d: 'prices', lvl: 2, q: 'New products keep reaching stores, but the CPI basket is slow to add them. As a result, the CPI tends to', a: 'overstate the rise in the cost of living', w: ['understate the rise in the cost of living', 'measure the cost of living exactly', 'fall below its base-year value', 'count the new products twice'], y: 'New goods give buyers more for their money, and a fixed basket misses that.' },
      { d: 'prices', lvl: 2, q: 'A car costs 5 percent more this year, but it is also safer and lasts longer. If the CPI ignores the better quality, it will', a: 'overstate inflation', w: ['understate inflation', 'show deflation', 'leave inflation unchanged', 'lower the base-year value'], y: 'Part of the higher price pays for a better car, not for inflation.' },
      { d: 'prices', lvl: 1, q: 'The CPI was 150 last year and is 147 this year. The inflation rate is', a: M + '2%', w: ['2%', '3%', M + '3%', '98%'], y: '(147 ' + M + ' 150) ' + '÷' + ' 150 ' + '×' + ' 100 = ' + M + '2.' },
      { d: 'prices', lvl: 3, f: 'convert', q: 'A gallon of milk cost $1.50 when the CPI was 60. The CPI today is 240. In today' + "'" + 's dollars, that gallon cost', a: '$6.00', w: ['$0.38', '$2.70', '$3.60', '$9.00'], y: '1.50 ' + '×' + ' (240 ' + '÷' + ' 60) = 6.00.' },
      { d: 'prices', lvl: 2, f: 'wagechange', q: 'Nominal wages rise 4 percent a year for three years while prices also rise 4 percent a year. What happens to real wages?', a: 'They stay about the same.', w: ['They rise about 12 percent.', 'They fall about 12 percent.', 'They rise about 4 percent.', 'They fall about 4 percent.'], y: 'Pay and prices rose together, so pay buys what it did before.' },
      { d: 'prices', lvl: 1, q: 'Which of the following best describes inflation?', a: 'A rise in the overall price level', w: ['A rise in the price of one popular good', 'A rise in real GDP over a year', 'A fall in the unemployment rate', 'A rise in the value of money'], y: 'Inflation is about prices on average, not one price.' },
      { d: 'prices', lvl: 1, f: 'realvalue', q: 'When the price level rises, the purchasing power of a dollar', a: 'falls', w: ['rises', 'stays the same', 'doubles', 'equals the CPI'], y: 'Each dollar buys less when prices are higher.' },
      { d: 'prices', lvl: 1, q: 'The CPI is 120 this year. Compared with the base year, prices on average are', a: '20 percent higher', w: ['120 percent higher', '20 percent lower', '1.2 percent higher', 'exactly the same'], y: 'The base year is 100, and 120 is 20 percent above it.' },

  const WORD_ORDER = ['expansion', 'peak', 'contraction', 'trough'];
  const steady = (labels) => {
    const low = labels.map((l) => String(l).toLowerCase());
    if (low.every((l) => WORD_ORDER.includes(l))) return labels.slice().sort((a, b) => WORD_ORDER.indexOf(String(a).toLowerCase()) - WORD_ORDER.indexOf(String(b).toLowerCase()));
    const num = (l) => { const m = /^[^0-9\u2212-]*([\u2212-]?[0-9][0-9,]*\.?[0-9]*)/.exec(String(l)); return m ? Number(m[1].replace(/,/g, '').replace('\u2212', '-')) : null; };

     numTask takes the right value and named mistakes. It keeps four different numbers, each with one reason. */
  function numTask(o) {
    const f = o.fmt || fmt.pct;
    const shown = f(o.value);
    const seen = new Set([shown]);
    const wrongs = [];
    (o.wrongs || []).forEach((w) => {
      const lab = f(w.v);
      if (!seen.has(lab) && wrongs.length < 3) { seen.add(lab); wrongs.push({ label: lab, why: w.why, v: w.v }); }
    });
    // A bank entry should always have enough named mistakes. This guards against repeats in rare number sets.
    let tryStep = 1;
    const nudge = Math.max(Math.abs(o.value) * 0.1, 1); // additive, so a right answer of zero can't loop forever
    while (wrongs.length < 3) {
      const lab = f(o.value + nudge * tryStep);
      if (!seen.has(lab)) { seen.add(lab); wrongs.push({ label: lab, why: 'Check the arithmetic.', v: o.value + nudge * tryStep }); }
      tryStep++;
    }
    const correct = { label: shown, why: 'Right. ' + (o.right || o.work), v: o.value };
    correct.why = correct.why.length > 80 ? 'Right.' : correct.why;
    const all = lowToHigh([correct].concat(wrongs));
    return finish({
      id: o.id, desk: o.desk, verb: 'pick', lvl: o.lvl, order: o.order, ask: o.ask, text: o.text, table: o.table,
      options: all, answer: all.indexOf(correct), why: o.why || o.work, work: o.work, formula: o.formula,
      calc: Object.assign({ f: o.calcF, in: o.calcIn, value: o.value, shown, fmt: Object.keys(fmt).find((k) => fmt[k] === f) }, o.calcExtra || {}),
    });
  }

      });
    },
    cpi([base, now], r, lvl) {

      return numTask({
        r, desk: 'prices', lvl, order: 'PRICE INDEX?', fmt: fmt.idx, table: [['Basket in the base year', fmt.usd2(base)], ['Basket this year', fmt.usd2(now)]],
        value: v, calcF: 'cpi', calcIn: { now, base }, formula: F.cpi,
        wrongs: [{ v: base / now * 100, why: 'That is base ÷ now. Flip it.' }, { v: (now - base) / base * 100, why: 'That is the percent rise, not the index.' }, { v: now - base, why: 'That is the change in dollars.' }],
        work: `${fmt.usd2(now)} ÷ ${fmt.usd2(base)} × 100 = ${fmt.idx(v)}`,

    infl([old, neu], r, lvl) {

      return numTask({
        r, desk: 'prices', lvl, order: 'INFLATION RATE?', table: [['CPI last year', old], ['CPI this year', neu]],
        value: v, calcF: 'infl', calcIn: { old, neu }, formula: F.infl,
        wrongs: [{ v: neu - old, why: 'That is the change in index points.' }, { v: (neu - old) / neu * 100, why: 'Divide by the old index, not the new one.' }, { v: neu - 100, why: 'That is the rise since the base year.' }, { v: neu / old * 100, why: 'Subtract the old index first. This is a ratio, not a rate.' }, { v: neu, why: 'That is the index itself, not the rate of change.' }],

    realwage([w, c], r, lvl) {

        r, desk: 'prices', lvl, order: 'REAL WAGE?', ask: 'In base-year dollars', fmt: fmt.usd2, table: [['Nominal wage', fmt.usd2(w)], ['CPI', c]],

    convert([p, a, b], r, lvl) {

  const BUILD = {

  /* ================= the business cycle wave =================
     actual(x) = potential(x) + a sine. x runs 0 to 1 across the chart. Markers carry computed facts. */
  const wave = {
    potential: (x) => 0.32 + 0.3 * x,
    actual: (x, phi) => wave.potential(x) + 0.17 * Math.sin(2 * Math.PI * (x * 1.6 + phi)),
    points(phi) {
      const h = 0.0005, slope = (x) => (wave.actual(x + h, phi) - wave.actual(x - h, phi)) / (2 * h);
      const gap = (x) => wave.actual(x, phi) - wave.potential(x);
      const out = [];
      const add = (x, phase, gapWord) => out.push({ x, phase, gap: gapWord });
      const steps = 2000;
      for (let i = 1; i < steps; i++) {
        const a = 0.04 + (i - 1) / steps * 0.92, b = 0.04 + i / steps * 0.92;
        if (slope(a) > 0 && slope(b) <= 0) add((a + b) / 2, 'peak', gap((a + b) / 2) > 0 ? 'positive' : 'negative');
        if (slope(a) < 0 && slope(b) >= 0) add((a + b) / 2, 'trough', gap((a + b) / 2) > 0 ? 'positive' : 'negative');
        if (gap(a) > 0 && gap(b) <= 0) add((a + b) / 2, slope(b) > 0 ? 'expansion' : 'contraction', 'zero');
        if (gap(a) < 0 && gap(b) >= 0) add((a + b) / 2, slope(b) > 0 ? 'expansion' : 'contraction', 'zero');
      }
      out.sort((p, q) => p.x - q.x);
      // Add the point halfway between each neighbouring pair: these are the plain rising or falling points.
      const mids = [];
      for (let i = 0; i < out.length - 1; i++) {
        const x = (out[i].x + out[i + 1].x) / 2;
        const g = gap(x);
        mids.push({ x, phase: slope(x) > 0 ? 'expansion' : 'contraction', gap: g > 0 ? 'positive' : 'negative' });
      }
      return out.concat(mids).sort((p, q) => p.x - q.x);
    },
  };
  const PHIS = [0.02, 0.16, 0.31, 0.44, 0.58];

    { prop: 'falling-below', order: 'FALLING AND BELOW?', ask: 'Tap the point falling and below potential.', lvl: 3, y: 'A contraction with a negative gap.', fit: (p) => p.phase === 'contraction' && p.gap === 'negative' },
    { prop: 'rising-below', order: 'RISING AND BELOW?', ask: 'Tap the point rising but still below potential.', lvl: 3, y: 'An expansion with a negative gap: rising, but still below potential.', fit: (p) => p.phase === 'expansion' && p.gap === 'negative' },
    { prop: 'rising-above', order: 'RISING AND ABOVE?', ask: 'Tap the point rising and above potential.', lvl: 3, y: 'An expansion with a positive gap.', fit: (p) => p.phase === 'expansion' && p.gap === 'positive' },
    { prop: 'falling-above', order: 'FALLING BUT ABOVE?', ask: 'Tap the point falling but still above potential.', lvl: 3, y: 'A contraction that has not yet crossed potential.', fit: (p) => p.phase === 'contraction' && p.gap === 'positive' },
  ];

  function chartMarkers(phi, ask, r) {
    const pts = wave.points(phi);
    const yes = shuffle(r, pts.filter(ask.fit));
    const no = shuffle(r, pts.filter((p) => !ask.fit(p)));
    if (!yes.length || no.length < 3) return null;
    const hit = yes[0];
    const chosen = [hit];
    for (const p of no) {
      if (chosen.length === 4) break;
      if (chosen.every((c) => Math.abs(c.x - p.x) > 0.11)) chosen.push(p);
    }
    if (chosen.length < 4) return null;
    chosen.sort((a, b) => a.x - b.x);
    return { markers: chosen, answer: chosen.indexOf(hit) };
  }
  const CHART_MEANING = (p) => {
    const name = BIN[p.phase].label;
    const gapWord = p.gap === 'zero' ? 'Zero gap' : p.gap === 'positive' ? 'Positive gap' : 'Negative gap';
    return `${name}. ${gapWord}.`;
  };
  function chartTapTask(ask, phi, r, id) {
    const m = chartMarkers(phi, ask, r);
    if (!m) return null;
    return finish({
      id, desk: 'cycle', verb: 'chart', lvl: ask.lvl, order: ask.order, ask: ask.ask,
      chart: { kind: 'cycle', phi, markers: m.markers, pickOne: true, prop: ask.prop },
      options: m.markers.map((p, i) => ({ label: 'Point ' + (i + 1), meaning: CHART_MEANING(p) })), answer: m.answer, why: ask.y,
    });
  }
  /* The other way around: one point is lit. Say what it is. */
  const CHART_READS = [
    { id: 'phase', order: 'WHAT IS THIS POINT?', lvl: 1, options: () => bins('expansion', 'peak', 'contraction', 'trough'), expect: (f) => BIN[f.phase].label, y: (p) => (p.phase === 'peak' ? 'The top of the wave.' : p.phase === 'trough' ? 'The bottom of the wave.' : p.phase === 'expansion' ? 'Real GDP is rising here.' : 'Real GDP is falling here.') },
    { id: 'gap', order: 'WHAT IS THE GAP?', lvl: 2, options: () => plain('Positive', 'Negative', 'Zero'), expect: (f) => (f.gap === 'positive' ? 'Positive' : f.gap === 'negative' ? 'Negative' : 'Zero'), y: (p) => (p.gap === 'zero' ? 'The wave is on the potential line.' : p.gap === 'positive' ? 'The wave is above the potential line.' : 'The wave is below the potential line.') },
    { id: 'unemp', order: 'U v. THE NATURAL RATE?', ask: 'Unemployment here, compared with the natural rate:', lvl: 2, options: () => plain('Above', 'Below', 'Equal'), expect: (f) => (f.gap === 'positive' ? 'Below' : f.gap === 'negative' ? 'Above' : 'Equal'), y: (p) => (p.gap === 'zero' ? 'At potential, unemployment equals the natural rate.' : p.gap === 'positive' ? 'Output above potential: unemployment is below the natural rate.' : 'Output below potential: unemployment is above the natural rate.') },
  ];
  function chartReadTask(read, phi, idx, id) {
    const pts = wave.points(phi);
    const p = pts[idx % pts.length];

      id, desk: 'cycle', verb: 'chart', lvl: read.lvl, order: read.order, ask: read.ask,

  /* Real and nominal lines cross at the base year. */
  const BASECHARTS = [

    { k: 'y3', base: 2, years: [2021, 2022, 2023, 2024, 2025] },
    { k: 'y4', base: 3, years: [2021, 2022, 2023, 2024, 2025] },

  /* The second batch of hand-written records joins these lists before the kinds below are built from them. */
  const LISTS = { GDP, FLOW, LOOP, INCOME, MISS, PEOPLE, TYPES, NATURAL, MOVES, NAMEIT, BIAS, EFFECTS, COSTS, REALNOM, PHASES, MEMOS, MICRO_MKT, MICRO_TAX, MICRO_ELASTIC };
  Object.keys(LISTS).forEach((name) => { if (MORE && MORE[name]) LISTS[name].push(...MORE[name]); });

  /* ================= kinds ================= */
  const K = [];
  function kind(id, desk, verb, records, build, extra) {
    K.push(Object.assign({ id, desk, verb, records, build }, extra || {}));
  }
  const recLvl = (r, d) => (r && r.lvl) || d;

  const COUNTED_OPTS = () => [{ key: 'in', label: 'Counted', stampClass: 'go' }, { key: 'out', label: 'Not counted', stampClass: 'no' }];
  kind('counted', 'gdp', 'stamp', GDP, (g) => stampTask({ desk: 'gdp', lvl: g.lvl, order: 'COUNT IT?', ask: "In this year's U.S. GDP?", text: g.t, options: COUNTED_OPTS(), key: g.line ? 'in' : 'out', why: g.y }));
  kind('line', 'gdp', 'sort', GDP.filter((g) => g.line), (g) => sortTask({ desk: 'gdp', lvl: Math.max(g.lvl, 1), order: 'WHICH LINE?', ask: 'Which part of GDP?', text: g.t, options: bins('C', 'I', 'G', 'Xn'), keep: true, key: g.line, why: g.y }));
  kind('whynot', 'gdp', 'sort', GDP.filter((g) => g.no), (g) => sortTask({ desk: 'gdp', lvl: Math.max(g.lvl, 2), order: 'WHY NOT COUNTED?', text: g.t, options: bins('used', 'intermediate', 'financial', 'transfer', 'abroad'), key: g.no, why: g.y }));
  kind('flow', 'gdp', 'flow', FLOW, (f) => finish({ desk: 'gdp', verb: 'flow', lvl: f.lvl, order: 'WHICH ARROW?', text: f.t, options: ARROWS.map((l, i) => ({ label: l, arrow: i })), answer: f.a, why: f.y }));
  kind('loop', 'gdp', 'stamp', LOOP, (l) => stampTask({ desk: 'gdp', lvl: l.lvl, order: 'OUT OR IN?', ask: 'Does this money leave the circular flow or come into it?', text: l.t, options: [{ key: 'out', label: 'Out of the loop', stampClass: 'no' }, { key: 'in', label: 'Into the loop', stampClass: 'go' }], key: l.dir, why: l.y }));
  kind('income', 'gdp', 'sort', INCOME, (x) => sortTask({ desk: 'gdp', lvl: x.lvl, order: 'WHICH INCOME?', text: x.t, options: bins('wages', 'rent', 'interest', 'profit'), key: x.key, why: x.y }));
  kind('approach', 'gdp', 'sort', APPROACH, (x) => sortTask({ desk: 'gdp', lvl: x.lvl || 1, order: 'WHICH APPROACH?', text: x.t, options: plain('Expenditures', 'Income', 'Value added'), key: x.key, why: x.y }));
  kind('c-gdp', 'gdp', 'pick', SETS.gdp, (s, r) => GEN.gdp(s, r, 1));
  kind('c-xn', 'gdp', 'pick', SETS.xn, (s, r) => GEN.xn(s, r, 1));

  kind('miss', 'miss', 'sort', MISS, (m, r) => sortTask({ desk: 'miss', lvl: m.lvl, order: 'WHAT DOES GDP MISS?', text: m.t, options: missBins(m.key, r), key: m.key, why: m.y }));

  kind('who', 'jobs', 'sort', PEOPLE, (p) => sortTask({ desk: 'jobs', lvl: p.lvl, order: 'WHO IS THIS?', text: p.t, options: bins('E', 'U', 'N'), keep: true, key: p.st, why: p.y }));
  kind('type', 'jobs', 'sort', TYPES, (t) => sortTask({ desk: 'jobs', lvl: t.lvl, order: 'WHICH TYPE?', text: t.t, options: bins('F', 'S', 'Cy'), key: t.key, why: t.y }));
  kind('natural', 'jobs', 'sort', NATURAL, (n) => sortTask({ desk: 'jobs', lvl: n.lvl, order: 'THE NATURAL RATE?', ask: 'What happens to the natural rate?', text: n.t, options: plain('Up', 'Down', 'No change'), key: n.key, why: n.y }));
  const townRecords = [];

  kind('town', 'jobs', 'town', townRecords, (m, r) => {

    const rate1 = after.u / (after.e + after.u) * 100, part1 = (after.e + after.u) / 100;
    const word = (a, b) => (Math.abs(a - b) < 1e-9 ? 'same' : b > a ? 'up' : 'down');
    const right = { rate: word(rate0, rate1), lfpr: word(part0, part1) };
    const key = (d) => d.rate + d.lfpr;
    const others = shuffle(r, DIRS.filter((d) => key(d) !== key(right))).slice(0, 3);

  kind('bias', 'prices', 'sort', BIAS, (b) => sortTask({ desk: 'prices', lvl: b.lvl, order: 'WHICH CPI BIAS?', text: b.t, options: bins('substitution', 'newgoods', 'betterq'), key: b.key, why: b.y }));

  kind('c-infl', 'prices', 'pick', SETS.infl, (s, r) => GEN.infl(s, r, 1));
  kind('c-wage', 'prices', 'pick', SETS.wage, (s, r) => GEN.realwage(s, r, 2));
  kind('c-convert', 'prices', 'pick', SETS.convert, (s, r) => GEN.convert(s, r, 3));
  kind('c-basket', 'prices', 'pick', SETS.basket, (s, r) => GEN.basket(s, r, 1));
  kind('c-wagechange', 'prices', 'pick', SETS.wagechange, (s, r) => GEN.wagechange(s, r, 2));
  kind('b-cpi', 'prices', 'build', SETS.cpi, (s, r) => BUILD.cpi(s, r, 1));
  kind('b-infl', 'prices', 'build', SETS.infl, (s, r) => BUILD.infl(s, r, 2));
  kind('b-wage', 'prices', 'build', SETS.wage, (s, r) => BUILD.realwage(s, r, 2));

  kind('menu', 'costs', 'stamp', COSTS, (c) => stampTask({ desk: 'costs', lvl: c.lvl, order: 'WHICH COST?', text: c.t, options: bins('menu', 'shoe').map((b) => Object.assign(b, { stampClass: 'neutral' })), key: c.key, why: c.y }));
  kind('c-realrate', 'costs', 'pick', SETS.realrate, (s, r) => GEN.realrate(s, r, 2));

  kind('realnom', 'real', 'stamp', REALNOM, (x) => stampTask({ desk: 'real', lvl: x.lvl, order: 'REAL OR NOMINAL?', text: x.t, options: plain('Real', 'Nominal').map((b) => Object.assign(b, { stampClass: 'neutral' })), key: x.key, why: x.y }));
  kind('both', 'real', 'sort', BOTHMOVES, ([q, p]) => {

    const qT = q === 0 ? 'Output does not change.' : q > 0 ? `Output rises ${q}%.` : `Output falls ${-q}%.`;

    return sortTask({

  kind('c-def', 'real', 'pick', SETS.real, (s, r) => GEN.deflator(s, r, 1));
  kind('c-nom', 'real', 'pick', SETS.real.slice(0, 5), (s, r) => GEN.nominal(s, r, 2));
  kind('c-growth', 'real', 'pick', SETS.growth, (s, r) => GEN.growth(s, r, 3));
  kind('c-onegood', 'real', 'pick', SETS.onegood, (s, r) => GEN.onegood(s, r, 2));
  kind('b-real', 'real', 'build', SETS.real, (s, r) => BUILD.realgdp(s, r, 1));
  kind('b-def', 'real', 'build', SETS.real, (s, r) => BUILD.deflator(s, r, 2));

    desk: 'real', verb: 'chart', lvl: 2, order: 'TAP THE BASE YEAR', ask: 'Nominal GDP and real GDP are on this chart.',

    why: 'After the base year, higher prices lift nominal GDP above real GDP.',
  }));

  const cycleTaps = [];
  CHART_ASKS.forEach((a) => PHIS.forEach((phi, j) => cycleTaps.push({ k: a.prop + '-' + j, a, phi })));
  kind('cycletap', 'cycle', 'chart', cycleTaps, (x, r) => chartTapTask(x.a, x.phi, r, 'x'));
  const cycleReads = [];
  CHART_READS.forEach((read) => PHIS.forEach((phi, j) => { for (let i = 0; i < 7; i += 2) cycleReads.push({ k: `${read.id}-${j}-${i}`, read, phi, idx: i + j }); }));
  kind('cycleread', 'cycle', 'chart', cycleReads, (x) => chartReadTask(x.read, x.phi, x.idx, 'x'));
  kind('phase', 'cycle', 'sort', PHASES, (p) => sortTask({ desk: 'cycle', lvl: p.lvl, order: 'WHERE ARE WE?', text: p.t, options: bins('expansion', 'peak', 'contraction', 'trough'), keep: true, key: p.key, why: p.y }));
  kind('sign', 'cycle', 'sort', SIGNS, ([u, n]) => {
    const key = u > n ? 'Below potential' : u < n ? 'Above potential' : 'At potential';
    return sortTask({
      desk: 'cycle', lvl: 2, order: 'READ THE SIGNS', ask: 'Where is real GDP?', text: `Unemployment is ${fmt.pct(u)}. The natural rate is ${fmt.pct(n)}.`, options: plain('Above potential', 'Below potential', 'At potential'), key,
      why: u > n ? 'Unemployment above the natural rate means a negative gap.' : u < n ? 'Unemployment below the natural rate means a positive gap.' : 'At the natural rate, output equals potential.',
    });
  });
  kind('c-cyc2', 'cycle', 'pick', SETS.cyclical.slice(0, 5), (s, r) => GEN.cyclical(s, r, 2, 'cycle'));
  kind('c-gap', 'cycle', 'pick', SETS.gap, (s, r) => GEN.gap(s, r, 2));

  kind('memo', 'memo', 'memo', MEMOS, (m, r) => {
    const place = shuffle(r, m.l.map((_, i) => i));
    const lines = place.map((i) => m.l[i]);

  });

  kind('mkt', 'micro', 'sort', MICRO_MKT, (x) => sortTask({ desk: 'micro', lvl: x.lvl, order: 'FLASHBACK: WHAT HAPPENS?', text: x.t, options: plain('Shortage', 'Surplus', 'No effect'), key: x.key, why: x.y }));
  kind('taxburden', 'micro', 'stamp', MICRO_TAX, (x) => stampTask({ desk: 'micro', lvl: x.lvl, order: 'FLASHBACK: WHO PAYS MORE?', ask: 'Who pays most of the tax?', text: x.t, options: plain('Buyers', 'Sellers').map((b) => Object.assign(b, { stampClass: 'neutral' })), key: x.key, why: x.y }));
  kind('elastic', 'micro', 'stamp', MICRO_ELASTIC, (x) => stampTask({ desk: 'micro', lvl: x.lvl, order: 'FLASHBACK: ELASTIC?', ask: 'Is demand elastic or inelastic?', text: x.t, options: plain('Elastic', 'Inelastic').map((b) => Object.assign(b, { stampClass: 'neutral' })), key: x.key, why: x.y }));
  kind('c-surplus', 'micro', 'pick', SURPLUS, (s, r) => GEN.surplus(s, r, 1));

  /* ================= test-style tables (added Nov 16, 2026) =================
     The other math tables in this game are clean. AP tables are not: they mix in taxes, depreciation, transfers,
     income items, or the whole population, and the student has to pick the right rows. These kinds drill that,
     plus the words "recessionary gap" and "inflationary gap", plus inventories of goods made abroad.
     New numbers only. Never copy the teacher's test. Every kind here has drill: true, so Practice a topic can deal
     them as their own topic (DRILL), and the Solo deal leans on them a little. */
  const DRILL = { key: 'drill', code: 'Test tables', long: 'Messy tables and gaps' };
  /* AP style: a practice topic that deals only the five-choice questions, from every desk (asked for Nov 17, 2026). */
  const APSTYLE = { key: 'ap', code: 'AP style', long: 'Five-choice questions, all topics' };
  const cell = (n) => sign(n) + comma(n);
  const NAMES = [
    { c: 'Consumption spending', i: 'Gross private domestic investment', g: 'Government purchases' },
    { c: 'Personal consumption expenditures', i: 'Investment spending', g: 'Government purchases' },
    { c: 'Household consumption', i: 'Private investment', g: 'Government purchases' },
  ];
  const JUNK_WHY = {
    tax: 'Taxes are not spending on new goods. Leave them out.',
    transfer: 'Transfers buy nothing new. They are not in GDP.',
    dep: 'Depreciation is not a spending line. Leave it out.',

  const spendRows = (o, r) => {

  const flipVal = (o) => (o.nx ? o.c + o.i + o.g - (o.x - o.m) : o.c + o.i + o.g + o.x + o.m);
  const tableOf = (rows, r) => shuffle(r, rows).map(([l, v]) => [l, cell(v)]);

  GEN.messygdp = (o, r) => {
    const val = o.c + o.i + o.g + o.x - o.m;
    const junkSum = o.junk.reduce((s, j) => s + j[1], 0);
    const rows = spendRows(o, r).concat(o.junk.map((j) => [j[0], j[1]]));

    return numTask({
      r, desk: 'gdp', lvl: o.lvl, order: 'GDP FROM A FULL TABLE?', ask: 'Use the expenditure approach. In billions of dollars.', fmt: fmt.bil, table: tableOf(rows, r),
      value: val, calcF: 'gdp', calcIn: { c: o.c, i: o.i, g: o.g, x: o.x, m: o.m }, formula: F.gdp,
      wrongs: [{ v: val + junkSum, why: 'Only C, I, G, and Xn count. Leave the other rows out.' }, { v: val + o.junk[0][1], why: JUNK_WHY[o.junk[0][2]] }, { v: flipVal(o), why: flipWhy(o) }, { v: o.c + o.i + o.g, why: 'That leaves out net exports.' }],

  GEN.mixedgdp = (o, r) => {

  kind('grab', 'grab', 'grab', grabRecords, (x, r) => {
    const g = x.g;
    const yes = shuffle(r, g.pool.filter(g.yes)).slice(0, 3), no = shuffle(r, g.pool.filter(g.no)).slice(0, 3);
    const all = shuffle(r, yes.concat(no));

      options: all.map((rec) => ({ label: rec.s, tag: g.tag(rec) })), answer: all.map((rec, i) => (yes.includes(rec) ? i : -1)).filter((i) => i >= 0), why: g.y,
    });
  });

  /* ================= every task, for tests and the answer key report ================= */
  function buildFrom(k, rec, r, i) {
    currentR = r;
    const t = k.build(rec, r);
    if (!t) return null;
    t.id = `${k.id}:${(rec && rec.k) || i}`;
    t.kind = k.id;
    if (api.learnFor) api.learnFor(t);
    return t;
  }
  function everyTask(seed) {
    const r = rng(seed || 1), out = [];
    K.forEach((k) => k.records.forEach((rec, i) => {
      const t = buildFrom(k, rec, r, i);
      if (t) out.push(t);
    }));
    return out;
  }

  /* ================= boss chains: The 8:30 Release =================
